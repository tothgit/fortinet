<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fortinet nástroje</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap');

  :root{
    --bg:#023444; --surface:#ffffff; --border:#e1e4ee;
    --text:#023444; --text-muted:#5b707b; --heading-on-bg:#ffffff;
    --accent:#884dff; --accent-strong:#6b2fe0; --accent-soft:#f1e9ff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--text);
    font-family:'Sora', system-ui, sans-serif;
    padding:24px;
  }
  .wrap{ max-width:520px; width:100%; }
  h1{
    font-size:22px; font-weight:700; margin:0 0 22px; text-align:center;
    color:var(--heading-on-bg);
  }
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:16px;
    padding:26px 28px; width:100%;
    box-shadow:0 8px 24px rgba(2,52,68,0.06);
    text-align:left;
    margin-bottom:16px;
  }
  .card h2{
    font-size:16px; font-weight:700; margin:0 0 8px;
  }
  .card p{
    color:var(--text-muted); font-size:14px; line-height:1.55; margin:0 0 20px;
  }
  a.btn{
    display:inline-block; text-decoration:none;
    background:var(--accent); color:#fff; font-weight:600; font-size:14.5px;
    padding:11px 22px; border-radius:10px;
    transition:background .15s ease;
  }
  a.btn:hover{ background:var(--accent-strong); }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Fortinet nástroje</h1>
    <div class="card">
      <h2>Product Lifecycle Radar</h2>
      <p>Přehled konce podpory (EoS/EoL) hardwaru, softwaru a služeb Fortinet, denně aktualizovaný z oficiálních RSS zdrojů Fortinet.</p>
      <a class="btn" href="./productlifecycle/">Otevřít dashboard</a>
    </div>
    <div class="card">
      <h2>IPsec MTU Calculator</h2>
      <p>Výpočet optimální MTU/MSS pro IPsec tunely na FortiGate.</p>
      <a class="btn" href="./ipsec-mtu-calculator/">Otevřít kalkulačku</a>
    </div>
  </div>
</body>
</html>
