<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fortinet Product Lifecycle Radar</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap');

  :root{
    --bg:#f5f6fa; --surface:#ffffff; --border:#e1e4ee;
    --text:#023444; --text-muted:#5b707b;
    --accent:#884dff; --accent-strong:#6b2fe0; --accent-soft:#f1e9ff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--text);
    font-family:'Sora', system-ui, sans-serif;
    padding:24px;
  }
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:16px;
    padding:40px 36px; max-width:480px; width:100%;
    box-shadow:0 8px 24px rgba(2,52,68,0.06);
    text-align:center;
  }
  h1{
    font-size:22px; font-weight:700; margin:0 0 10px;
  }
  p{
    color:var(--text-muted); font-size:14.5px; line-height:1.55; margin:0 0 26px;
  }
  a.btn{
    display:inline-block; text-decoration:none;
    background:var(--accent); color:#fff; font-weight:600; font-size:15px;
    padding:12px 26px; border-radius:10px;
    transition:background .15s ease;
  }
  a.btn:hover{ background:var(--accent-strong); }
  .foot{
    margin-top:22px; font-size:12px; color:var(--text-muted);
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Fortinet Product Lifecycle Radar</h1>
    <p>Přehled konce podpory (EoS/EoL) hardwaru, softwaru a služeb Fortinet, denně aktualizovaný z oficiálních RSS zdrojů Fortinet.</p>
    <a class="btn" href="./productlifecycle/">Otevřít dashboard</a>
    <div class="foot">Seyfor a.s.</div>
  </div>
</body>
</html>
