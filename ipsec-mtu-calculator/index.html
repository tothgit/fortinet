<!doctype html>
<html lang="cs" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FortiGate IPsec MTU Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Seyfor brand book 2022 – Lawn Green #89E103, Violet #884DFF, Sherpa Blue #023444, White #FBFDFC, Sivá #F7F7FA,
   chart-only Turquoise #5DE5E9 (more than three data segments). Typeface Sora. Single dark look (brand book p. 86–87). */
:root{
  --lime:#89E103; --violet:#884DFF; --sherpa:#023444; --white:#FBFDFC; --turq:#5DE5E9;
  --bg:#012A37; --surface:#023444; --surface-2:#0A3D4D; --ink:#FBFDFC; --muted:#A7BCC2; --line:#154A5A;
  --accent:#89E103; --accent-ink:#023444; --accent-soft:rgba(137,225,3,.12);
  --good:#89E103; --good-soft:rgba(137,225,3,.14); --warn:#F2B84B; --warn-soft:rgba(242,184,75,.12); --bad:#FF7A7A; --bad-soft:rgba(255,122,122,.13);
  --neutral:#46707C;
  --seg-ip:#5DE5E9; --seg-l4:#4BC2C8; --seg-esp:#884DFF; --seg-iv:#6647D0; --seg-ovl:#22727E;
  --seg-pad:#468A24; --seg-trl:#67B613; --seg-icv:#89E103;
  --code-bg:#01202A; --code-ink:#D8E8E4; --code-dim:#7FA0A8;
  --font-display:"Sora","Century Gothic",system-ui,sans-serif;
  --font-body:"Sora","Century Gothic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;
  color-scheme: dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:400 14.5px/1.6 var(--font-body);margin:0;padding-inline:16px;padding-block:0 56px}
.wrap{max-width:1380px;margin:0 auto}
a{color:var(--lime)}
code,kbd{font-family:var(--font-mono);font-size:.88em}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 32px;padding-block:32px 24px;margin-bottom:8px}
.kicker{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.08em;color:var(--muted);margin:0 0 10px}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(30px,4.4vw,46px);line-height:1.02;letter-spacing:-.015em;margin:0;text-wrap:balance}
.lede{margin:12px 0 0;color:var(--muted);max-width:66ch;font-weight:300}
.lang{display:inline-flex;gap:6px}
.lang button{font:600 13px/1 var(--font-body);border:2px solid var(--lime);background:transparent;color:var(--lime);padding:9px 16px;border-radius:0;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--lime);color:var(--sherpa)}

/* layout */
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:start}
.panel{background:var(--surface);border-radius:4px;padding:4px 20px 8px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0}
.pcol{display:grid;align-content:start;min-width:0;padding-inline:20px;border-left:1px solid var(--line)}
.pcol:first-child{padding-left:0;border-left:0}
.pcol:last-child{padding-right:0}
@media (max-width:1100px){.panel{grid-template-columns:repeat(2,minmax(0,1fr))}.pcol:nth-child(3){padding-left:0;border-left:0}.pcol:nth-child(2){padding-right:0}.pcol:nth-child(n+3){border-top:1px solid var(--line)}}
@media (max-width:640px){.panel{grid-template-columns:minmax(0,1fr)}.pcol{padding-inline:0;border-left:0}.pcol+.pcol{border-top:1px solid var(--line)}}
.grp{display:grid;gap:10px;padding-block:16px;border-bottom:1px solid var(--line)}
.grp:last-child{border-bottom:0}
.grp h3,.sub-h{font-family:var(--font-display);font-weight:600;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}
.sub-h{font-size:11px;margin-top:4px}
.hint{font-size:12px;line-height:1.55;color:var(--muted);margin:0;font-weight:300}
.hint code{color:var(--ink);white-space:normal;overflow-wrap:anywhere}
.hint b{font-weight:600;color:var(--ink)}

/* controls */
.field{display:grid;gap:5px;font-size:12.5px;font-weight:400;min-width:0}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
input[type=number],select{font:600 14.5px/1.2 var(--font-mono);color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:2px;padding:9px 10px;width:100%;min-width:0}
select{font-family:var(--font-body);font-weight:400;font-size:13.5px}
select option,select optgroup{background:var(--surface);color:var(--ink)}
input[type=number]:focus,select:focus{border-color:var(--lime);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
select:disabled{opacity:.45}
input[aria-invalid="true"]{border-color:var(--bad);box-shadow:0 0 0 3px var(--bad-soft)}
.chips{position:relative;display:flex;flex-wrap:wrap;gap:6px}
.chips input,.opts input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.chips label{font-size:12.5px;font-weight:600;padding:7px 12px;border:2px solid var(--lime);border-radius:0;cursor:pointer;background:transparent;color:var(--lime);white-space:nowrap}
.chips input:checked+label{background:var(--lime);border-color:var(--lime);color:var(--sherpa)}
.chips input:focus-visible+label,.opts input:focus-visible+label{outline:2px solid var(--white);outline-offset:2px}
.opts{position:relative;display:grid;gap:6px}
.opts label{display:grid;grid-template-columns:16px 1fr;column-gap:10px;align-items:start;padding:9px 11px;border:1px solid var(--line);border-radius:2px;cursor:pointer;background:var(--surface-2)}
.opts label::before{content:"";grid-row:1 / span 2;width:14px;height:14px;margin-top:3px;border-radius:50%;border:1.5px solid var(--muted);box-sizing:border-box}
.opts input:checked+label{border-color:var(--lime);box-shadow:inset 3px 0 0 var(--lime)}
.opts input:checked+label::before{border:4px solid var(--lime)}
.opts b{font-weight:600;font-size:13.5px}
.opts small{grid-column:2;font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.check{display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer}
.check input{accent-color:var(--lime);width:16px;height:16px;margin:0}
.subopts{display:grid;gap:8px;padding:10px 12px;background:rgba(0,0,0,.18);border-radius:2px}
.propline{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline;font-size:12.5px;color:var(--muted)}
.propline code{font-size:13.5px;font-weight:600;color:var(--sherpa);background:var(--lime);padding:2px 8px}
.params{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0}
.params div{background:var(--surface-2);padding:6px 8px}
.params dt{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.params dd{margin:0;font:600 14px/1.3 var(--font-mono)}
.flag{font-size:12px;line-height:1.5;padding:8px 10px;background:var(--warn-soft);color:var(--ink);border-left:3px solid var(--warn);margin:0;font-weight:300}
.flag b,.flag code{font-weight:600}
.flag.bad{background:var(--bad-soft);border-left-color:var(--bad)}

/* results */
.results{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;min-width:0}
.card,.block{background:var(--surface);border-radius:4px;padding:20px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.tile{background:var(--surface);border-radius:4px;padding:18px 18px 16px;display:grid;gap:6px;align-content:start;border:1px solid transparent}
.tile .tv{display:grid;gap:6px}
.tile .v{font:700 clamp(34px,3.6vw,46px)/1 var(--font-display);color:var(--lime);letter-spacing:-.03em}
.tile .v small{font-size:.32em;font-weight:400;margin-left:3px;color:var(--muted);letter-spacing:0}
.tile .k{font-weight:600;font-size:15px;line-height:1.15}
.tile .s{font-size:11.5px;line-height:1.4;color:var(--muted);font-weight:300}
.tile .s code{font-size:11px;color:var(--ink)}
.tile.bad{border-color:var(--bad);background:linear-gradient(var(--bad-soft),var(--bad-soft)),var(--surface)}
.tile.bad .v{color:var(--bad)}
.ping{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;font-size:12.5px;color:var(--muted);margin-top:12px;font-weight:300}
.ping code{color:var(--ink);background:var(--surface);padding:3px 8px}
.alerts{display:grid;gap:8px;margin-top:12px}
.alerts:empty{display:none}

.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:20px;margin-top:20px}
@media (max-width:1100px){.row2{grid-template-columns:minmax(0,1fr)}}
.hd{display:flex;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.hd .big{font:700 32px/1 var(--font-display);color:var(--lime);letter-spacing:-.02em}
.hd .tt{font-weight:600;font-size:17px;line-height:1.15}
.hd .tt small{display:block;font-weight:300;font-size:11.5px;color:var(--muted);margin-top:2px}
.donutwrap{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.donutwrap svg{flex:none}
.dlegend{display:grid;gap:9px;font-size:12.5px;margin:0}
.dlegend div{display:flex;align-items:center;gap:8px}
.dlegend i{width:10px;height:10px;flex:none;background:var(--c)}
.dlegend dd{margin:0 0 0 auto;padding-left:14px;font:600 13px var(--font-mono)}
.dlegend dt{font-weight:400}
.lbars{display:grid;grid-template-columns:1fr 1fr;gap:12px 24px}
@media (max-width:560px){.lbars{grid-template-columns:1fr}}
.lbar .lb{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--muted);margin-bottom:5px}
.lbar .lb span{display:flex;align-items:center;gap:6px;min-width:0}
.lbar .lb i{width:8px;height:8px;flex:none;background:var(--c)}
.lbar .lb b{color:var(--ink);font:600 11.5px var(--font-mono);white-space:nowrap}
.lbar .tr{height:8px;background:rgba(0,0,0,.28)}
.lbar .fl{height:8px;background:var(--lime);border-radius:0 4px 4px 0}

.block h2{font-family:var(--font-display);font-weight:700;font-size:24px;line-height:1.15;margin:0 0 4px;text-wrap:balance}
.block>.hint{font-size:12.5px;max-width:78ch;margin-bottom:14px}
.frame{background:rgba(0,0,0,.18);border-radius:2px;padding:16px}

/* packet strip */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.strip{display:grid;gap:2px;min-width:600px;padding-bottom:4px}
.sg{background:var(--c);color:var(--si,#023444);padding:8px 4px 7px;text-align:center;font-family:var(--font-mono);line-height:1.2;min-width:0;overflow:hidden}
.sg b{display:block;font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg span{display:block;font-size:11px;opacity:.85;font-variant-numeric:tabular-nums}
.sg.user{--c:var(--surface-2);color:var(--ink);background-image:repeating-linear-gradient(135deg,transparent 0 9px,rgba(251,253,252,.07) 9px 10px);outline:1px dashed var(--neutral);outline-offset:-1px}
.br{border-top:2px solid var(--bc,var(--muted));position:relative;padding-top:4px;font-size:11px;color:var(--muted);text-align:center;white-space:nowrap;margin-top:4px}
.br::before,.br::after{content:"";position:absolute;top:-6px;width:2px;height:6px;background:var(--bc,var(--muted))}
.br::before{left:0}.br::after{right:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:11.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;background:var(--c);margin-right:5px;vertical-align:-1px}

/* tables */
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
thead th{font-weight:600;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
td.n,th.n{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td.ref{font-size:11.5px;color:var(--muted);white-space:nowrap}
.sw{display:inline-block;width:10px;height:10px;background:var(--c);margin-right:8px;vertical-align:-1px}
.sw.user{background:var(--surface-2);outline:1px dashed var(--neutral)}
tfoot td{font-weight:600;border-bottom:0}
tfoot tr:first-child td{border-top:1px solid var(--muted)}
td.n.neg{color:var(--bad)}
.tbl{min-width:560px}

/* packet check */
.check-grid{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr);gap:16px 24px;align-items:start}
@media (max-width:600px){.check-grid{grid-template-columns:minmax(0,1fr)}}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:0}
.kv div{background:var(--surface-2);padding:9px 11px}
.kv dt{font-size:11px;color:var(--muted)}
.kv dd{margin:0;font:700 19px/1.3 var(--font-display);color:var(--ink)}
.verdict{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:13px;line-height:1.35;padding:7px 12px;margin-top:10px;border-left:3px solid currentColor}
.verdict.ok{background:var(--good-soft);color:var(--good)}
.verdict.no{background:var(--bad-soft);color:var(--bad)}
.verdict.warn{background:var(--warn-soft);color:var(--warn)}
.verdict.info{background:rgba(93,229,233,.1);color:var(--turq)}

/* proposal chart + matrix */
.pchart{margin-bottom:18px;min-width:560px}
.pchart svg{display:block;width:100%;height:auto}
.pchart .bar{cursor:pointer}
.pchart .bar:hover rect.m,.pchart .bar:focus rect.m{filter:brightness(1.15)}
.pchart .bar:focus{outline:none}
.pchart .bar:focus-visible rect.hit{stroke:var(--white);stroke-width:1}
.matrix{min-width:640px}
.matrix th[scope=row]{font-weight:600;white-space:nowrap}
.matrix th[scope=row] small{display:block;font-family:var(--font-mono);font-size:10.5px;color:var(--muted);font-weight:400}
.matrix td{padding:4px}
.matrix button{width:100%;border:1px solid transparent;background:var(--surface-2);border-radius:0;padding:6px 8px;cursor:pointer;color:var(--ink);text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.matrix button b{display:block;font-size:14.5px;font-weight:600}
.matrix button span{display:block;font-size:10.5px;color:var(--muted)}
.matrix button:hover{border-color:var(--lime)}
.matrix button[aria-pressed="true"]{background:var(--lime);color:var(--sherpa);border-color:var(--lime)}
.matrix button[aria-pressed="true"] span{color:var(--sherpa);opacity:.8}
.matrix button.aead{text-align:left;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.matrix button.aead b{display:inline}
.matrix button.aead>span{display:inline;font-size:11.5px;color:var(--muted)}
.matrix button.aead b span{display:inline;margin-left:6px}
.matrix .na{color:var(--muted);font-size:11.5px;text-align:center;padding:10px 8px}

/* tooltip */
.tip{position:fixed;z-index:20;pointer-events:none;background:var(--white);color:var(--sherpa);font:600 12px/1.35 var(--font-body);padding:6px 9px;max-width:260px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.tip small{display:block;font-weight:400;font-family:var(--font-mono);font-size:11px}

/* cli */
.cli-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 10px 8px 14px;background:var(--code-bg);border-bottom:1px solid var(--line)}
.cli-head span{font-family:var(--font-mono);font-size:11.5px;color:var(--code-dim)}
.cli-head button{font:600 12.5px/1 var(--font-body);background:transparent;color:var(--lime);border:2px solid var(--lime);border-radius:0;padding:7px 12px;cursor:pointer}
.cli-head button:hover{background:var(--lime);color:var(--sherpa)}
pre.cli{margin:0;background:var(--code-bg);color:var(--code-ink);padding:14px 16px;font:12.5px/1.65 var(--font-mono);overflow-x:auto;tab-size:4}
pre.cli .ph{color:#BFA0FF}
pre.cli .kw{color:var(--lime)}
pre.cli .cm{color:var(--code-dim);font-style:italic}
ul.notes{margin:14px 0 0;padding-left:18px;display:grid;gap:7px;font-size:13px;max-width:82ch;font-weight:300}
ul.notes li::marker{color:var(--lime)}
ul.notes code{background:var(--surface-2);padding:1px 5px;font-weight:400}
ul.notes b{font-weight:600}

details{background:rgba(0,0,0,.18);padding:0 16px;margin-top:16px}
details[open]{padding-bottom:14px}
summary{cursor:pointer;font-weight:600;padding:12px 0;font-size:13.5px}
summary::marker{color:var(--lime)}
.ok-mark{color:var(--good);font-weight:700}
.bad-mark{color:var(--bad);font-weight:700}
.sources{columns:2 320px;column-gap:28px;padding-left:18px;font-size:12.5px;margin:8px 0 0;font-weight:300}
.sources li{break-inside:avoid;margin-bottom:5px}
footer{margin-top:36px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;font-weight:300}
@media (prefers-reduced-motion:no-preference){.matrix button,.chips label,.opts label,.lang button,.cli-head button{transition:background-color .12s,border-color .12s,color .12s}}
.matrix button.aead[aria-pressed="true"]>span,.matrix button.aead[aria-pressed="true"] b span{color:var(--sherpa);opacity:.85}
.pcol>.grp:not(:has(~ .grp:not([hidden]))){border-bottom:0}
.pcol,.grp,.subopts,.opts{grid-template-columns:minmax(0,1fr)}
.opts label{min-width:0}.opts small,.opts b{overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <div>
    <p class="kicker">IPv4 · ESP · FortiOS · FortiClient</p>
    <h1>FortiGate IPsec MTU Calculator</h1>
    <p class="lede" data-i18n="lede"></p>
  </div>
  <div class="lang" role="group" aria-label="Jazyk / Language">
    <button type="button" id="lang-cs" data-lang="cs" aria-pressed="true">CZ</button>
    <button type="button" id="lang-en" data-lang="en" aria-pressed="false">EN</button>
  </div>
</header>

<div class="layout">
  <aside class="panel" aria-label="Inputs">
   <div class="pcol">
    <section class="grp" aria-labelledby="g-kind">
      <h3 id="g-kind" data-i18n="gKind"></h3>
      <div class="chips seg2" role="radiogroup" aria-labelledby="g-kind">
        <input type="radio" name="kind" id="k-s2s" value="s2s" checked><label for="k-s2s">Site-to-Site</label>
        <input type="radio" name="kind" id="k-ra" value="ra"><label for="k-ra">Remote Access</label>
      </div>
      <p class="hint" data-i18n="hintKind"></p>
    </section>

    <section class="grp" aria-labelledby="g-under">
      <h3 id="g-under" data-i18n="gUnder"></h3>
      <div class="chips" role="radiogroup" aria-labelledby="g-under">
        <input type="radio" name="preset" id="p-eth" value="1500" checked><label for="p-eth">Ethernet 1500</label>
        <input type="radio" name="preset" id="p-pppoe" value="1492"><label for="p-pppoe">PPPoE 1492</label>
        <input type="radio" name="preset" id="p-custom" value="custom"><label for="p-custom" data-i18n="custom"></label>
      </div>
      <div class="field-row">
        <label class="field" for="wanMtu"><span id="wanMtuLbl"></span>
          <input type="number" id="wanMtu" min="68" max="9216" step="1" value="1500" inputmode="numeric"></label>
        <label class="field" for="extra"><span data-i18n="extra"></span>
          <input type="number" id="extra" min="0" max="1000" step="1" value="0" inputmode="numeric"></label>
      </div>
      <label class="field" for="cliMtu" id="cliMtuWrap" hidden><span data-i18n="cliMtu"></span>
        <input type="number" id="cliMtu" min="68" max="9216" step="1" value="1500" inputmode="numeric"></label>
      <p class="hint" id="hintRA" data-i18n="hintUnderRA" hidden></p>
      <p class="hint" data-i18n-html="hintUnder"></p>
    </section>

   </div>
   <div class="pcol">
    <section class="grp" aria-labelledby="g-tr">
      <h3 id="g-tr" data-i18n="gTransport"></h3>
      <div class="opts" role="radiogroup" aria-labelledby="g-tr">
        <input type="radio" name="transport" id="t-esp" value="esp">
        <label for="t-esp"><b data-i18n="tEsp"></b><small data-i18n="tEspSub"></small></label>
        <input type="radio" name="transport" id="t-udp" value="udp" checked>
        <label for="t-udp"><b>NAT-T</b><small data-i18n="tUdpSub"></small></label>

<script>
/* ---------- Calculation engine (IPv4 only) ---------- */
const CIPHERS = {
  'null':             { fam: 'null',   block: 1,  iv: 0,  aead: false, ref: 'RFC 2410' },
  'des':              { fam: 'des',    block: 8,  iv: 8,  aead: false, ref: 'RFC 2405' },
  '3des':             { fam: '3des',   block: 8,  iv: 8,  aead: false, ref: 'RFC 2451' },
  'aes128':           { fam: 'aescbc', block: 16, iv: 16, aead: false, ref: 'RFC 3602' },
  'aes192':           { fam: 'aescbc', block: 16, iv: 16, aead: false, ref: 'RFC 3602' },
  'aes256':           { fam: 'aescbc', block: 16, iv: 16, aead: false, ref: 'RFC 3602' },
  'aria128':          { fam: 'aria',   block: 16, iv: 16, aead: false, ref: 'RFC 5794', unverified: true },
  'aria192':          { fam: 'aria',   block: 16, iv: 16, aead: false, ref: 'RFC 5794', unverified: true },
  'aria256':          { fam: 'aria',   block: 16, iv: 16, aead: false, ref: 'RFC 5794', unverified: true },
  'seed':             { fam: 'seed',   block: 16, iv: 16, aead: false, ref: 'RFC 4196' },
  'aes128gcm':        { fam: 'gcm',    block: 4,  iv: 8,  aead: true, icv: 16, ref: 'RFC 4106' },
  'aes256gcm':        { fam: 'gcm',    block: 4,  iv: 8,  aead: true, icv: 16, ref: 'RFC 4106' },
  'chacha20poly1305': { fam: 'chacha', block: 4,  iv: 8,  aead: true, icv: 16, ref: 'RFC 7634' }
};
const INTEG = {
  'null':   { icv: 0,  ref: 'RFC 2410' },
  'md5':    { icv: 12, ref: 'RFC 2403' },
  'sha1':   { icv: 12, ref: 'RFC 2404' },
  'sha256': { icv: 16, ref: 'RFC 4868' },
  'sha384': { icv: 24, ref: 'RFC 4868' },
  'sha512': { icv: 32, ref: 'RFC 4868' }
};
/* One representative cipher per family for the comparison matrix */
const FAMILIES = [
  { fam: 'null',   rep: 'null',   names: 'null' },
  { fam: 'des',    rep: 'des',    names: 'des' },
  { fam: '3des',   rep: '3des',   names: '3des' },
  { fam: 'aescbc', rep: 'aes128', names: 'aes128 / aes192 / aes256' },
  { fam: 'aria',   rep: 'aria128', names: 'aria128 / aria192 / aria256' },
  { fam: 'seed',   rep: 'seed',   names: 'seed' },
  { fam: 'gcm',    rep: 'aes128gcm', names: 'aes128gcm / aes256gcm' },
  { fam: 'chacha', rep: 'chacha20poly1305', names: 'chacha20poly1305' }
];
const INTEG_ORDER = ['null', 'md5', 'sha1', 'sha256', 'sha384', 'sha512'];

function proposalName(c, i) { return CIPHERS[c].aead ? c : c + '-' + i; }
function isValidProposal(c, i) { return CIPHERS[c].aead || !(c === 'null' && i === 'null'); }
function sumBytes(list) { return list.reduce((a, s) => a + s.b, 0); }

/* cfg: { pathMtu, transport: 'esp'|'udp'|'tcp', tcpOpt, cipher, integ,
          overlay: 'none'|'gre'|'vxlan', mode: 'tunnel'|'transport',
          greCsum, greKey, greSeq, vxlanTag }
   U  : size of the user IPv4 packet (bytes)                              */
function buildPacket(cfg, U) {
  const c = CIPHERS[cfg.cipher];
  const icv = c.aead ? c.icv : INTEG[cfg.integ].icv;
  const align = Math.max(c.block, 4);               // RFC 4303 §2.4: at least 4-byte alignment
  const mode = cfg.overlay === 'gre' ? cfg.mode : 'tunnel';

  const ovl = [];
  if (cfg.overlay === 'gre') {
    if (mode === 'tunnel') ovl.push({ k: 'greIp', b: 20 });
    ovl.push({ k: 'gre', b: 4 });                     // RFC 2784 base header
    if (cfg.greCsum) ovl.push({ k: 'greCsum', b: 4 }); // RFC 2890 field order: Checksum, Key, Sequence
    if (cfg.greKey)  ovl.push({ k: 'greKey', b: 4 });
    if (cfg.greSeq)  ovl.push({ k: 'greSeq', b: 4 });
  } else if (cfg.overlay === 'vxlan') {
    ovl.push({ k: 'vxIp', b: 20 }, { k: 'vxUdp', b: 8 }, { k: 'vxlan', b: 8 }, { k: 'eth', b: 14 });
    if (cfg.vxlanTag) ovl.push({ k: 'dot1q', b: 4 });
  }
  const ovlBytes = sumBytes(ovl);
  const payload = ovlBytes + U;                       // ESP Payload Data
  const pad = (align - ((payload + 2) % align)) % align;

  const segs = [];
  segs.push({ k: mode === 'transport' ? 'outerIpT' : 'outerIp', b: 20, grp: 'outer' });
  if (cfg.transport === 'udp') segs.push({ k: 'udp', b: 8, grp: 'encap' });
  if (cfg.transport === 'tcp') {
    segs.push({ k: 'tcp', b: 20 + (cfg.tcpOpt || 0), grp: 'encap' });
    segs.push({ k: 'tcpLen', b: 2, grp: 'encap' });
  }
  segs.push({ k: 'espHdr', b: 8, grp: 'esp' });
  if (c.iv) segs.push({ k: 'iv', b: c.iv, grp: 'esp', ref: c.ref });
  ovl.forEach(o => segs.push({ k: o.k, b: o.b, grp: 'ovl', enc: true }));
  segs.push({ k: 'user', b: U, grp: 'user', enc: true });
  if (pad) segs.push({ k: 'pad', b: pad, grp: 'pad', enc: true });
  segs.push({ k: 'trl', b: 2, grp: 'trl', enc: true });
  if (icv) segs.push({ k: 'icv', b: icv, grp: 'icv', ref: c.aead ? c.ref : INTEG[cfg.integ].ref });

  const total = sumBytes(segs);
  const espLen = 8 + c.iv + payload + pad + 2 + icv;
  return { segs, total, pad, payload, ovlBytes, icv, align, iv: c.iv, mode, espLen,
           fixed: total - U - pad };
}

/* Largest user packet that fits into pathMtu (null if nothing fits) */
function maxUser(cfg) {
  const probe = buildPacket(cfg, 0);
  let U = cfg.pathMtu - probe.fixed;
  if (U < 0) return null;
  for (; U >= 0; U--) {
    const r = buildPacket(cfg, U);
    if (r.total <= cfg.pathMtu) return { U, r };
  }
  return null;
}

if (typeof module !== 'undefined') module.exports = { CIPHERS, INTEG, FAMILIES, INTEG_ORDER, buildPacket, maxUser, proposalName, isValidProposal };

/* ---------- Strings ---------- */

  gUnder: 'Podkladová linka (WAN)', custom: 'Vlastní',
  wanMtu: 'MTU rozhraní WAN (B)', extra: 'Další režie na cestě (B)',

    ['Fortinet KB – How to override MTU for IPsec VPN interfaces', 'https://community.fortinet.com/fortigate-3/technical-tip-how-to-override-mtu-for-ipsec-vpn-interfaces-on-the-fortigate-95600'],
    ['Fortinet KB – Setting TCP MSS value', 'https://community.fortinet.com/fortigate-3/technical-tip-setting-tcp-mss-value-96548'],
    ['Fortinet KB – Dial-up VPN IPsec over TCP best practices', 'https://community.fortinet.com/t5/FortiGate/Technical-Tip-Dial-up-VPN-IPsec-over-TCP-Best-Practices/ta-p/398245'],
    ['Fortinet KB – Fortinet-ESP parameter remains enabled after changing transport', 'https://community.fortinet.com/t5/FortiGate/Technical-Tip-Fortinet-ESP-Parameter-remains-enabled-after/ta-p/425741'],
    ['strongSwan – Fortinet interoperability (aes128gcm16 ↔ aes128gcm)', 'https://docs.strongswan.org/docs/latest/interop/fortinet.html'],
    ['RFC 7383 – IKEv2 Message Fragmentation', RFC(7383)],
    ['RFC 7296 – Internet Key Exchange Protocol Version 2 (IKEv2)', RFC(7296)],
    ['Fortinet Admin Guide 7.6.6 – Choosing IKE version 1 and 2 (IKE fragmentation)', FDOC + '7.6.6/administration-guide/167137/choosing-ike-version-1-and-2'],
    ['Fortinet Admin Guide 8.0.0 – Configuration scripts (# comments)', FDOC + '8.0.0/administration-guide/780930/configuration-scripts'],
    ['Fortinet KB – IP packet fragmentation over IPsec tunnel interface explained', 'https://community.fortinet.com/t5/FortiGate/Technical-Tip-IP-Packet-fragmentation-over-IPSec-tunnel/ta-p/265295'],
    ['Fortinet KB – Troubleshooting IPsec VPN tunnel errors with large size packets', 'https://community.fortinet.com/t5/FortiGate/Technical-Tip-Troubleshooting-IPsec-VPN-tunnel-errors-with-large/ta-p/194539'],
    ['Fortinet KB – Behavior of TCP-MSS setting under system interface', 'https://community.fortinet.com/t5/FortiGate/Technical-Tip-Behavior-of-TCP-MSS-setting-under-system-interface/ta-p/221376'],
    ['Fortinet Admin Guide 7.6.6 – Dialup IPsec VPN using custom TCP port', FDOC + '7.6.6/administration-guide/567401/dialup-ipsec-vpn-using-custom-tcp-port'],
    ['FortiOS 7.6.6 CLI – config system settings (ike-tcp-port)', FDOC + '7.6.6/cli-reference/130421147/config-system-settings'],
    ['FortiClient 8.0.0 XML reference – IPsec VPN (mtu_size)', 'https://docs.fortinet.com/document/forticlient/8.0.0/xml-reference-guide/739387/ipsec-vpn'],
    ['FortiClient 8.0.0 XML reference – IKE settings', 'https://docs.fortinet.com/document/forticlient/8.0.0/xml-reference-guide/96295/ike-settings'],
    ['FortiClient 8.0.0 XML reference – IPsec settings', 'https://docs.fortinet.com/document/forticlient/8.0.0/xml-reference-guide/358032/ipsec-settings'],
    ['FortiClient 8.0.0 Admin Guide – Configuring an IPsec VPN connection', 'https://docs.fortinet.com/document/forticlient/8.0.0/administration-guide/494391/configuring-an-ipsec-vpn-connection']
  ];
  const VEC_SRC_A = [SOURCES[19][0].replace('Fortinet ', ''), SOURCES[19][1]];
  const VEC_SRC_B = [SOURCES[23][0].replace('Fortinet ', ''), SOURCES[23][1]];
  const VECTORS = [
    { c: 'aes128', i: 'sha1', tr: 'esp', dst: '1500*', fgt: 1438, src: VEC_SRC_A },
    { c: 'aes256', i: 'sha256', tr: 'udp', dst: '1500', fgt: 1422, src: VEC_SRC_B },
    { c: 'aes128', i: 'sha1', tr: 'udp', dst: '1500', fgt: 1422, src: VEC_SRC_B }
  ];

  /* ----- phase 1 helpers ----- */
  function fillP1Prf() {
    const enc = $('p1enc').value, sel = $('p1prf');
    const aead = P1_AEAD.indexOf(enc) >= 0;
    const list = aead ? P1_PRF : P1_INTEG;
    const cur = sel.value;
    const want = list.indexOf(cur) >= 0 ? cur : list[0];
    if (sel.dataset.kind !== (aead ? 'prf' : 'integ')) {
      sel.innerHTML = list.map(v => '<option value="' + v + '">' + v + '</option>').join('');
      sel.dataset.kind = aead ? 'prf' : 'integ';
    }
    sel.value = want;
    sel.disabled = enc === 'default';
  }
  const p1Proposal = cfg => (cfg.p1enc === 'default' ? P1_DEFAULT : cfg.p1enc + '-' + cfg.p1prf);

  /* ----- tunnel type ----- */
  function applyKind(kind) {
    const ra = kind === 'ra';
    const each = (list, fn) => Array.prototype.forEach.call(list, fn);
    const setOpts = (id, allowed, fallback) => {
      const sel = $(id);
      each(sel.options, o => { const ok = !ra || allowed.indexOf(o.value) >= 0; o.hidden = !ok; o.disabled = !ok; });
      each(sel.querySelectorAll('optgroup'), g => { g.hidden = ra && !Array.prototype.some.call(g.children, o => !o.hidden); });
      if (ra && allowed.indexOf(sel.value) < 0) sel.value = fallback;
    };
    setOpts('cipher', RA_P2, 'aes256');
    setOpts('integ', RA_INTEG, 'sha256');
    setOpts('p1enc', RA_P1, 'aes256');
    if (ra) $('o-none').checked = true;
    fillP1Prf();
  }
  function raInfo(cfg, m) {
    const ok = Number.isFinite(cfg.mtuSize) && cfg.mtuSize >= 576 && cfg.mtuSize <= 1500;
    if (!ok || !m) return { ok: ok, mss: null, over: null, eff: null };
    const eff = Math.min(cfg.mtuSize, m.U);
    return { ok: ok, mss: eff - 40, over: cfg.mtuSize - m.U, eff: eff };
  }

  /* ----- state ----- */
  function readCfg() {
    const wan = parseInt($('wanMtu').value, 10);
    const extraRaw = parseInt($('extra').value, 10);
    const extra = Number.isFinite(extraRaw) ? extraRaw : 0;
    const q = n => document.querySelector('input[name="' + n + '"]:checked').value;
    const kind = q('kind'), ra = kind === 'ra';
    const cli = parseInt($('cliMtu').value, 10);
    const wanOk = Number.isFinite(wan) && wan >= 68 && wan <= 9216;
    const cliOk = !ra || (Number.isFinite(cli) && cli >= 68 && cli <= 9216);
    const baseMtu = ra && cliOk && wanOk ? Math.min(wan, cli) : wan;
    const valid = wanOk && cliOk && extra >= 0 && extra < baseMtu;
    return {
      kind, cli, cliOk, wanOk,
      mtuSize: parseInt($('mtuSize').value, 10),
      tcpPort: clampInt($('tcpPort').value, 1, 65535),
      valid, wan, extra, pathMtu: valid ? baseMtu - extra : 0,
      transport: q('transport'), ipfrag: q('ipfrag'),
      tcpOpt: Math.ceil(clampInt($('tcpOpt').value, 0, 40) / 4) * 4,
      cipher: $('cipher').value, integ: $('integ').value,
      overlay: ra ? 'none' : q('overlay'), mode: q('mode'),
      greCsum: $('greCsum').checked, greKey: $('greKey').checked, greSeq: $('greSeq').checked,
      vxlanTag: $('vxTag').checked,
      p1enc: $('p1enc').value, p1prf: $('p1prf').value,
      dh: Array.prototype.slice.call(document.querySelectorAll('#dhgrp input:checked')).map(i => i.value),
      ikeFrag: $('ikeFrag').checked,
      fragMtu: parseInt($('fragMtu').value, 10)
    };
  }

  /* ----- render ----- */
  let lastKey = '';
  function render(force) {
    const cfg = readCfg();
    const key = JSON.stringify(cfg);
    if (!force && key === lastKey) return;   // e.g. a blur-triggered change event with nothing new
    lastKey = key;
    const c = CIPHERS[cfg.cipher];
    const ra = cfg.kind === 'ra';
    ['cliMtuWrap', 'hintRA', 'fcGroup', 'xmlBlock', 'raP1Flag', 'raP2Flag', 'raDhFlag'].forEach(id => { $(id).hidden = !ra; });
    $('ovlGroup').hidden = ra;
    $('wanMtuLbl').textContent = ra ? t('wanMtuRA') : t('wanMtu');
    $('cliMtu').setAttribute('aria-invalid', String(!cfg.cliOk));
    $('mtuSize').setAttribute('aria-invalid', String(ra && !raInfo(cfg, null).ok));
    $('tcpOpts').hidden = cfg.transport !== 'tcp';
    $('greOpts').hidden = cfg.overlay !== 'gre';
    $('vxOpts').hidden = cfg.overlay !== 'vxlan';
    $('integ').disabled = c.aead;
    $('wanMtu').setAttribute('aria-invalid', String(!cfg.wanOk));
    $('extra').setAttribute('aria-invalid', String(!cfg.valid && cfg.wanOk && cfg.cliOk));
    $('propName').textContent = proposalName(cfg.cipher, cfg.integ);
    $('p1Name').textContent = p1Proposal(cfg);
    $('fragMtuWrap').hidden = !cfg.ikeFrag;
    const fragOk = Number.isFinite(cfg.fragMtu) && cfg.fragMtu >= 500 && cfg.fragMtu <= 16000;
    $('fragMtu').setAttribute('aria-invalid', String(cfg.ikeFrag && !fragOk));
    $('dhHint').textContent = cfg.dh.length ? t('hintDh') : t('dhNone');
    $('dhHint').className = cfg.dh.length ? 'hint' : 'flag bad';
    const validProp = isValidProposal(cfg.cipher, cfg.integ);
    const m = cfg.valid && validProp ? maxUser(cfg) : null;
    renderParams(cfg, validProp);
    renderSummary(cfg, m, validProp);
    renderAnatomy(cfg, m);
    renderUsage(cfg, m);
    renderLayers(cfg, m);
    renderCheck(cfg, validProp);
    renderPchart(cfg);
    renderMatrix(cfg);
    renderIke(cfg, fragOk);
    renderCli(cfg, m, validProp);
    if (ra) renderXml(cfg, m);
  }

  function renderIke(cfg, fragOk) {
    const out = $('ikeOut');
    if (!cfg.valid) { out.innerHTML = '<p class="flag bad">' + t('errMtu') + '</p>'; return; }
    const P = cfg.pathMtu;
    const kv = (k, val) => '<div><dt>' + k + '</dt><dd>' + val + '</dd></div>';
    let h = '', limit;
    if (cfg.transport === 'tcp') {
      h += '<dl class="kv ike-kv">' + kv(t('ikeMax') + ' · ' + t('ikeTcp'), t('ikeTcpVal')) + '</dl>';
      h += '<div class="stack"><span>IPv4 20</span><span>TCP ' + (20 + cfg.tcpOpt) + '</span><span>Length 2</span><span>non-ESP marker 4</span><span>IKE …</span></div>';
      h += '<span class="verdict info">' + t('ikeTcpInfo') + '</span>';
      out.innerHTML = h;
      return;
    }
    const m500 = P - 20 - 8, m4500 = P - 20 - 8 - 4;
    if (cfg.transport === 'udp') {
      h += '<dl class="kv ike-kv">' + kv(t('ikeMax') + ' · UDP 500', m500 + ' B') + kv(t('ikeMax') + ' · UDP 4500', m4500 + ' B') + '</dl>';
      h += '<div class="stack"><span>' + P + '</span>−<span>IPv4 20</span>−<span>UDP 8</span>−<span>non-ESP marker 4</span>=<b>' + m4500 + ' B</b><span>(UDP 4500)</span></div>';
      limit = m4500;
    } else {
      h += '<dl class="kv ike-kv">' + kv(t('ikeMax') + ' · UDP 500', m500 + ' B') + '</dl>';
      h += '<div class="stack"><span>' + P + '</span>−<span>IPv4 20</span>−<span>UDP 8</span>=<b>' + m500 + ' B</b></div>';
      limit = m500;
    }
    if (!cfg.ikeFrag) {
      h += '<span class="verdict warn">' + t('ikeFragOff', { n: limit }) + '</span><p class="hint" style="margin-top:8px">' + t('ikeFragOffNote') + '</p>';
    } else if (!fragOk) {
      h += '<p class="flag bad" style="margin-top:10px">' + t('fragErr') + '</p>';
    } else if (cfg.fragMtu <= limit) {
      h += '<span class="verdict ok">' + t('ikeFragOk', { v: cfg.fragMtu, n: limit }) + '</span>';
    } else {
      h += '<span class="verdict warn">' + t('ikeFragWarn', { v: cfg.fragMtu, n: limit }) + '</span><p class="hint" style="margin-top:8px">' + t('ikeFragWarnNote', { n: limit }) + '</p>';
    }
    out.innerHTML = h;
  }

  function renderParams(cfg, validProp) {
    const c = CIPHERS[cfg.cipher];
    const icv = c.aead ? c.icv : INTEG[cfg.integ].icv;
    $('params').innerHTML =
      '<div><dt>' + t('pAlign') + '</dt><dd>' + Math.max(c.block, 4) + ' B</dd></div>' +
      '<div><dt>IV</dt><dd>' + c.iv + ' B</dd></div>' +
      '<div><dt>ICV</dt><dd>' + icv + ' B</dd></div>';
    let f = '';
    if (c.aead) f += '<p class="hint">' + t('aeadInteg') + '</p>';
    if (c.unverified) f += '<p class="flag">' + t('ariaFlag') + '</p>';
    if (!validProp) f += '<p class="flag bad">' + t('nullNull') + '</p>';
    $('propFlags').innerHTML = f;
  }

  function tile(cls, k, v, s) {
    const val = typeof v === 'number' ? v + '<small>B</small>' : v;
    return '<div class="tile ' + cls + '"><div class="tv"><span class="v">' + val + '</span><span class="k">' + k + '</span></div><span class="s">' + s + '</span></div>';
  }

  function renderSummary(cfg, m, validProp) {
    const alerts = [];
    if (!cfg.valid) alerts.push(['bad', t('errMtu')]);
    else if (!validProp) alerts.push(['bad', t('nullNull')]);
    else if (!m) alerts.push(['bad', t('errNoFit', { n: cfg.pathMtu, o: buildPacket(cfg, 0).fixed })]);
    if (m && m.U < 68) alerts.push(['bad', t('warnMin', { n: m.U })]);
    if (m && m.r.mode === 'tunnel' && m.r.payload < 1420) alerts.push(['warn', t('warnSa', { n: m.r.payload })]);
    const ra = cfg.kind === 'ra';
    const ri = ra ? raInfo(cfg, m) : null;
    if (ra && !ri.ok) alerts.push(['bad', t('mtuSizeErr')]);
    if (ra && m && ri.ok && ri.over > 0) alerts.push(['bad', t('warnMtuSize', { m: cfg.mtuSize, u: m.U, p: cfg.pathMtu })]);
    if (m && ra) {
      const U = m.U, r = m.r;
      $('tiles').innerHTML =
        tile('primary', t('tMtu'), U, t('tMtuSubRA', { p: cfg.pathMtu })) +
        tile(ri.ok && ri.over > 0 ? 'bad' : '', t('tMtuSize'), ri.ok ? cfg.mtuSize : '—',
          ri.ok ? (ri.over > 0 ? t('tMtuSizeBad', { n: ri.over }) : t('tMtuSizeOk', { n: -ri.over })) : t('mtuSizeErr')) +
        tile('', t('tMssRA'), ri.mss !== null && ri.mss > 0 ? ri.mss : '—', ri.ok && ri.over > 0 ? t('tMssRASubCap') : t('tMssRASub')) +
        tile('', t('tSa'), r.payload, t('tSaSub'));
      const d = (ri.eff !== null ? ri.eff : U) - 28;
      $('ping').innerHTML = d >= 0
        ? '<span>' + t('pingLabel') + '</span><code>ping -f -l ' + d + ' &lt;IP&gt;</code><span>Windows</span><code>ping -M do -s ' + d + ' &lt;IP&gt;</code><span>Linux</span>'
        : '';
    } else if (m) {
      const U = m.U, r = m.r;
      const mss = U - 40;
      $('tiles').innerHTML =
        tile('primary', t('tMtu'), U, t('tMtuSub')) +
        tile('', t('tMss'), mss > 0 ? mss : '—', t('tMssSub')) +
        tile('', t('tOver'), r.total - U, t('tOverSub', { f: r.fixed, p: r.pad })) +
        tile('', t('tSa'), r.payload, r.mode === 'tunnel' ? t('tSaSub') : t('tSaSubT'));
      const d = U - 28;
      $('ping').innerHTML = d >= 0
        ? '<span>' + t('pingLabel') + '</span><code>ping -f -l ' + d + ' &lt;IP&gt;</code><span>Windows</span><code>ping -M do -s ' + d + ' &lt;IP&gt;</code><span>Linux</span>'
        : '';
    } else {
      $('tiles').innerHTML = tile('primary', t('tMtu'), '—', t('tMtuSub')) + tile('', t('tMss'), '—', t('tMssSub')) +
        tile('', t('tOver'), '—', '') + tile('', t('tSa'), '—', '');
      $('ping').innerHTML = '';
    }
    $('alerts').innerHTML = alerts.map(a => '<p class="flag ' + (a[0] === 'bad' ? 'bad' : '') + '">' + a[1] + '</p>').join('');
  }

  function segLabel(cfg, s, U) {
    let l = t('seg_' + s.k);
    if (s.k === 'tcp' && cfg.tcpOpt) l += ' (20 + ' + cfg.tcpOpt + ' B opt.)';
    if (s.k === 'user' && U >= 40) l += ' — ' + t('seg_userD', { m: U - 40 });
    return l;
  }

  function packetView(cfg, m) {
    const raMode = cfg.kind === 'ra';
    const ri = raMode ? raInfo(cfg, m) : null;
    const U = raMode && ri.ok ? cfg.mtuSize : m.U;
    const r = U === m.U ? m.r : buildPacket(cfg, U);
    return { U: U, r: r, raMode: raMode, ri: ri };
  }

  function renderUsage(cfg, m) {
    if (!m) { $('donut').innerHTML = ''; $('dlegend').innerHTML = ''; $('useBig').textContent = '—'; $('useSub').textContent = ''; return; }
    const pv = packetView(cfg, m), U = pv.U, r = pv.r, P = cfg.pathMtu;
    const over = r.total - U, free = P - r.total;
    const parts = [[U, 'var(--lime)', t('lgData')], [over, 'var(--violet)', t('lgOver')]];
    if (free > 0) parts.push([free, 'var(--neutral)', t('lgFree')]);
    const whole = Math.max(P, r.total);
    const R = 58, C = 2 * Math.PI * R, gap = 2;
    let off = 0, arcs = '';
    parts.forEach(p => {
      const len = C * p[0] / whole;
      const draw = Math.max(len - gap, 0.5);
      arcs += '<circle cx="75" cy="75" r="' + R + '" fill="none" stroke="' + p[1] + '" stroke-width="16" stroke-dasharray="' + draw + ' ' + (C - draw) +
        '" stroke-dashoffset="' + (-off) + '" transform="rotate(-90 75 75)" data-tip="' + esc(p[2] + ' · ' + p[0] + ' B') + '"/>';
      off += len;
    });
    const pct = Math.round(r.total / P * 100);
    const over100 = r.total > P;
    $('donut').innerHTML = '<svg width="150" height="150" viewBox="0 0 150 150" role="img" aria-label="' + esc(t('useTitle') + ': ' + pct + ' %') + '">' + arcs +
      '<text x="75" y="75" text-anchor="middle" font-family="Sora, sans-serif" font-weight="700" font-size="28" fill="' + (over100 ? 'var(--bad)' : 'var(--white)') + '">' + pct + '%</text>' +
      '<text x="75" y="95" text-anchor="middle" font-family="Sora, sans-serif" font-weight="300" font-size="11" fill="var(--muted)">' + esc(t('useCenter')) + '</text></svg>';
    const row = (c, k, v, cls) => '<div><i style="--c:' + c + '"></i><dt' + (cls ? ' style="color:var(--bad)"' : '') + '>' + k + '</dt><dd>' + v + ' B</dd></div>';
    $('dlegend').innerHTML = row('var(--lime)', t('lgData'), U) + row('var(--violet)', t('lgOver'), over) +
      (free >= 0 ? row('var(--neutral)', t('lgFree'), free) : row('var(--bad)', t('lgOverflow'), -free, true));
    $('useBig').textContent = P;
    $('useSub').textContent = t('useSub', { u: U, p: P });
  }

  function renderLayers(cfg, m) {
    if (!m) { $('lbars').innerHTML = ''; $('layBig').textContent = '—'; return; }
    const r = packetView(cfg, m).r;
    const segs = r.segs.filter(x => x.k !== 'user');
    const tot = segs.reduce((a, x) => a + x.b, 0);
    $('layBig').textContent = tot;
    $('lbars').innerHTML = segs.map(x =>
      '<div class="lbar" data-tip="' + esc(t('seg_' + x.k) + ' · ' + x.b + ' B') + '"><div class="lb"><span><i style="--c:var(' + COLOR[x.k] + ')"></i>' + esc(LY[x.k]) + '</span><b>' + x.b + ' / ' + tot + ' B</b></div>' +
      '<div class="tr"><div class="fl" style="width:' + (x.b / tot * 100).toFixed(1) + '%"></div></div></div>').join('');
  }

  function renderPchart(cfg) {
    const box = $('pchart');
    if (!cfg.valid) { box.innerHTML = ''; $('pchartSub').textContent = ''; return; }
    const ra = cfg.kind === 'ra';
    const curName = proposalName(cfg.cipher, cfg.integ);
    const list = (ra ? PCH_RA : PCH_S2S).slice();
    if (!list.some(x => proposalName(x[0], x[1]) === curName) && isValidProposal(cfg.cipher, cfg.integ))
      list.push([cfg.cipher, CIPHERS[cfg.cipher].aead ? 'null' : cfg.integ]);
    const data = list.map(x => {
      const mm = maxUser(Object.assign({}, cfg, { cipher: x[0], integ: x[1] }));
      return { c: x[0], i: x[1], name: proposalName(x[0], x[1]), mtu: mm ? mm.U : null, over: mm ? cfg.pathMtu - mm.U : null };
    }).filter(d => d.mtu !== null);
    $('pchartSub').textContent = t('pchartSub', { n: cfg.pathMtu });
    if (!data.length) { box.innerHTML = ''; return; }
    const W = 880, H = 270, pl = 46, pr = 10, pt = 30, pb = 44;
    const maxV = Math.max.apply(null, data.map(d => d.over));
    const step = maxV > 200 ? 100 : maxV > 100 ? 50 : 25;
    const top = Math.ceil((maxV + 1) / step) * step;
    const y = v => pt + (1 - v / top) * (H - pt - pb);
    let g = '';
    for (let v = 0; v <= top; v += step) {
      g += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="var(--line)" stroke-width="1"/>' +
        '<text x="' + (pl - 8) + '" y="' + (y(v) + 3.5) + '" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="10.5" fill="var(--muted)">' + v + '</text>';
    }
    g += '<text x="' + (pl - 8) + '" y="' + (pt - 16) + '" text-anchor="end" font-family="Sora, sans-serif" font-size="10" fill="var(--muted)">B</text>';
    const band = (W - pl - pr) / data.length, bw = Math.min(34, band * 0.55);
    data.forEach((d, idx) => {
      const cx = pl + band * idx + band / 2, x = cx - bw / 2, y0 = y(0), y1 = y(d.over), h = y0 - y1, rr = Math.min(4, h);
      const cur = d.name === curName;
      const path = 'M' + x + ' ' + y0 + ' V' + (y1 + rr) + ' Q' + x + ' ' + y1 + ' ' + (x + rr) + ' ' + y1 + ' H' + (x + bw - rr) +
        ' Q' + (x + bw) + ' ' + y1 + ' ' + (x + bw) + ' ' + (y1 + rr) + ' V' + y0 + ' Z';
      const tip = d.name + ' · ' + t('tipMtu') + ' ' + d.mtu + ' B · ' + t('tipOver') + ' ' + d.over + ' B';
      g += '<g class="bar" tabindex="0" role="button" aria-pressed="' + cur + '" aria-label="' + esc(tip) + '" data-tip="' + esc(tip) + '" data-c="' + d.c + '" data-i="' + d.i + '">' +
        '<rect class="hit" x="' + (cx - band / 2 + 2) + '" y="' + pt + '" width="' + (band - 4) + '" height="' + (H - pt - pb + 30) + '" fill="transparent"/>' +
        '<path class="m" d="' + path + '" fill="' + (cur ? 'var(--lime)' : 'var(--neutral)') + '"/>' +
        '<text x="' + cx + '" y="' + (y1 - 8) + '" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" font-weight="' + (cur ? 700 : 600) + '" fill="var(--white)">' + d.mtu + '</text>' +
        '<text x="' + cx + '" y="' + (H - pb + 18) + '" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10.5" fill="' + (cur ? 'var(--white)' : 'var(--muted)') + '"' + (cur ? ' font-weight="700"' : '') + '>' + esc(d.name) + '</text></g>';
    });
    box.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="group" aria-label="' + esc(t('matrix')) + '">' + g + '</svg>';
  }

  function renderAnatomy(cfg, m) {
    const strip = $('strip'), table = $('breakdown');
    if (!m) {
      strip.innerHTML = ''; table.innerHTML = ''; $('legend').innerHTML = '';
      $('anatSub').textContent = '';
      return;
    }
    const pv = packetView(cfg, m), raMode = pv.raMode, ri = pv.ri, U = pv.U, r = pv.r;
    const segs = r.segs;
    const encOn = cfg.cipher !== 'null';
    $('anatSub').textContent = t(raMode && ri.ok ? 'anatSubRA' : 'anatSub', { u: U });
    strip.style.gridTemplateColumns = segs.map(s => s.k === 'user'
      ? 'minmax(110px, 64fr)'
      : 'minmax(' + (s.k === 'trl' || s.k === 'dot1q' || s.k === 'vxlan' ? 50 : 40) + 'px, ' + Math.max(s.b, 3) + 'fr)').join(' ');
    let h = segs.map((s, i) => {
      const style = 'grid-column:' + (i + 1) + ';grid-row:1;' + (s.k === 'user' ? '' : '--c:var(' + COLOR[s.k] + ');--si:' + (SEG_INK[s.k] || '#FBFDFC'));
      return '<div class="sg' + (s.k === 'user' ? ' user' : '') + '" style="' + style + '" title="' + esc(segLabel(cfg, s, U)) + ' · ' + s.b + ' B">' +
        '<b>' + SHORT[s.k] + '</b><span>' + s.b + '</span></div>';
    }).join('');
    const idx = k => segs.findIndex(s => s.k === k);
    const br = (a, b, row, label, color) => '<div class="br" style="grid-column:' + (a + 1) + ' / ' + (b + 2) + ';grid-row:' + row + ';--bc:var(' + color + ')">' + label + '</div>';
    const iEsp = idx('espHdr'), iTrl = idx('trl'), iLast = segs.length - 1;
    const encapIdx = segs.map((s, i) => (s.grp === 'encap' ? i : -1)).filter(i => i >= 0);
    h += br(iEsp, iLast, 2, t('brEsp'), '--seg-esp');
    if (encapIdx.length) h += br(encapIdx[0], encapIdx[encapIdx.length - 1], 2, cfg.transport === 'tcp' ? t('brTcp') : t('brUdp'), '--seg-l4');
    if (encOn) h += br(segs.findIndex(s => s.enc), iTrl, 3, t('brEnc'), '--seg-trl');
    if (r.icv) h += br(iEsp, iTrl, encOn ? 4 : 3, t('brIcv'), '--seg-icv');
    strip.innerHTML = h;

    const leg = [['--seg-ip', 'IPv4']];  // legend of the strip
    if (encapIdx.length) leg.push(['--seg-l4', cfg.transport === 'tcp' ? 'TCP + Length' : 'UDP']);
    leg.push(['--seg-esp', 'ESP'], ['--seg-iv', 'IV']);
    if (cfg.overlay !== 'none') leg.push(['--seg-ovl', cfg.overlay === 'gre' ? 'GRE' : 'VXLAN']);
    leg.push(['--seg-pad', 'Padding'], ['--seg-trl', 'Pad Length + Next Header']);
    if (r.icv) leg.push(['--seg-icv', 'ICV']);
    $('legend').innerHTML = leg.map(l => '<span><i style="--c:var(' + l[0] + ')"></i>' + l[1] + '</span>').join('');

    const c = CIPHERS[cfg.cipher];
    let off = 0;
    const rows = segs.map(s => {
      let ref = REF[s.k] || '';
      if (s.k === 'iv' || s.k === 'icv') ref = s.ref;
      const sw = s.k === 'user' ? '<span class="sw user"></span>' : '<span class="sw" style="--c:var(' + COLOR[s.k] + ')"></span>';
      const row = '<tr><td>' + sw + esc(segLabel(cfg, s, U)) + '</td><td class="n">' + off + '</td><td class="n">' + s.b +
        '</td><td>' + (s.enc && encOn ? t('yes') : '—') + '</td><td class="ref">' + esc(ref) + '</td></tr>';
      off += s.b;
      return row;
    }).join('');
    table.innerHTML =
      '<thead><tr><th scope="col">' + t('colField') + '</th><th scope="col" class="n">' + t('colOffset') + '</th><th scope="col" class="n">' +
      t('colBytes') + '</th><th scope="col">' + t('colEnc') + '</th><th scope="col">' + t('colRef') + '</th></tr></thead>' +
      '<tbody>' + rows + '</tbody>' +
      '<tfoot><tr><td>' + t('rowTotal') + '</td><td></td><td class="n">' + r.total + '</td><td></td><td></td></tr>' +
      '<tr><td>' + t('rowPath') + (cfg.kind === 'ra' ? ' (min ' + cfg.wan + ' / ' + cfg.cli + (cfg.extra ? ' − ' + cfg.extra : '') + ')' : (cfg.extra ? ' (' + cfg.wan + ' − ' + cfg.extra + ')' : '')) + '</td><td></td><td class="n">' + cfg.pathMtu + '</td><td></td><td></td></tr>' +
      '<tr><td>' + t('rowSpare') + '</td><td></td><td class="n' + (cfg.pathMtu - r.total < 0 ? ' neg' : '') + '">' + (cfg.pathMtu - r.total) + '</td><td></td><td class="ref">' +
      (c.block > 4 ? 'block ' + c.block + ' B' : 'align 4 B') + '</td></tr></tfoot>';
  }

  function renderCheck(cfg, validProp) {
    const v = parseInt($('pkt').value, 10);
    const ok = Number.isFinite(v) && v >= 20 && v <= 65535;
    $('pkt').setAttribute('aria-invalid', String(!ok));
    const out = $('checkOut');
    if (!cfg.valid || !validProp) { out.innerHTML = ''; return; }
    if (!ok) { out.innerHTML = '<p class="flag bad">' + t('pktErr') + '</p>'; return; }
    const r = buildPacket(cfg, v);
    const diff = cfg.pathMtu - r.total;
    const kv = (k, val) => '<div><dt>' + k + '</dt><dd>' + val + ' B</dd></div>';
    out.innerHTML = '<dl class="kv">' + kv(t('cPad'), r.pad) + kv(t('cEsp'), r.espLen) + kv(t('cOuter'), r.total) + kv(t('cPath'), cfg.pathMtu) + '</dl>' +
      (diff >= 0
        ? '<span class="verdict ok">' + t('fits', { n: diff }) + '</span>'
        : '<span class="verdict no">' + t('exceeds', { n: -diff }) + '</span><p class="hint" style="margin-top:8px">' + t(cfg.ipfrag === 'pre' ? 'exceedsPre' : 'exceedsNote') + '</p>');
  }

  function renderMatrix(cfg) {
    const ovl = cfg.overlay === 'none' ? t('none') : (cfg.overlay === 'gre' ? 'GRE (' + cfg.mode + ')' : 'VXLAN');
    const raM = cfg.kind === 'ra';
    const cols = raM ? INTEG_ORDER.filter(i => RA_INTEG.indexOf(i) >= 0) : INTEG_ORDER;
    const fams = raM ? FAMILIES.filter(f => RA_FAMS.indexOf(f.fam) >= 0) : FAMILIES;
    $('matrixSub').textContent = !cfg.valid ? t('errMtu')
      : raM ? t('matrixSubRA', { n: cfg.pathMtu, t: TR_LABEL[cfg.transport] })
      : t('matrixSub', { n: cfg.pathMtu, t: TR_LABEL[cfg.transport], o: ovl });
    const curFam = CIPHERS[cfg.cipher].fam;
    const res = (cipher, integ) => (cfg.valid ? maxUser(Object.assign({}, cfg, { cipher: cipher, integ: integ })) : null);
    const mss = m => (m && m.U > 40 ? m.U - 40 : '—');
    let h = '<thead><tr><th scope="col">' + t('mCipher') + '</th>' + cols.map(i => '<th scope="col" class="n">' + i + '</th>').join('') + '</tr></thead><tbody>';
    fams.forEach(f => {
      const rep = CIPHERS[f.rep];
      h += '<tr><th scope="row">' + FAM_LABEL[f.fam] + '<small>' + f.names + '</small></th>';
      if (rep.aead) {
        const m = res(f.rep, 'null');
        h += '<td colspan="' + cols.length + '"><button type="button" class="aead" data-fam="' + f.fam + '" aria-pressed="' + (curFam === f.fam) + '">' +
          '<span>' + t('mAead') + '</span><b>' + (m ? m.U : '—') + ' <span>MSS ' + mss(m) + '</span></b></button></td>';
      } else {
        cols.forEach(i => {
          if (!isValidProposal(f.rep, i)) { h += '<td class="na">' + t('mInvalid') + '</td>'; return; }
          const m = res(f.rep, i);
          const pressed = curFam === f.fam && cfg.integ === i;
          h += '<td><button type="button" data-fam="' + f.fam + '" data-integ="' + i + '" aria-pressed="' + pressed + '" title="' + proposalName(f.rep, i) + '">' +
            '<b>' + (m ? m.U : '—') + '</b><span>MSS ' + mss(m) + '</span></button></td>';
        });
      }
      h += '</tr>';
    });
    $('matrix').innerHTML = h + '</tbody>';
  }

  function mtuPlan(cfg, m) {
    const mode = cfg.overlay === 'gre' ? cfg.mode : 'tunnel';
    const sa = m ? m.r.payload : null;
    const reason = cfg.ipfrag === 'pre' ? 'pre' : (sa !== null && sa < 1420 ? 'low' : 'none');
    return { mode, sa, reason, emit: mode === 'tunnel' && reason !== 'none', value: sa !== null ? sa : '<mtu>' };
  }

  function p1Bits(cfg, L) {
    L.push('        set proposal ' + p1Proposal(cfg));
    L.push('        set dhgrp ' + (cfg.dh.length ? cfg.dh.join(' ') : '<dh-group>'));
    L.push('        set fragmentation ' + (cfg.ikeFrag ? 'enable' : 'disable'));
    if (cfg.ikeFrag) L.push('        set fragmentation-mtu ' + (Number.isFinite(cfg.fragMtu) && cfg.fragMtu >= 500 && cfg.fragMtu <= 16000 ? cfg.fragMtu : '<500-16000>'));
    if (cfg.transport === 'esp') L.push('        set nattraversal disable');
    if (cfg.transport === 'udp') L.push('        set nattraversal enable');
    if (cfg.transport === 'tcp') L.push('        set transport tcp', '        set fortinet-esp disable');
    if (cfg.ipfrag === 'pre') L.push('        set ip-fragmentation pre-encapsulation');
  }

  function cliLinesRA(cfg, m) {
    const plan = mtuPlan(cfg, m);
    const ri = raInfo(cfg, m);
    const MSS = ri.mss !== null && ri.mss > 0 ? ri.mss : '<mss>';
    const L = [t('cliAuthComment')];
    L.push('config vpn ipsec phase1-interface', '    edit "<tunnel>"', '        set type dynamic', '        set interface "<wan>"',
      '        set ike-version 2', '        set peertype any', '        set net-device disable', '        set mode-cfg enable',
      '        set ipv4-start-ip <pool-start-ip>', '        set ipv4-end-ip <pool-end-ip>');
    p1Bits(cfg, L);
    L.push('    next', 'end');
    L.push('config vpn ipsec phase2-interface', '    edit "<tunnel>"', '        set phase1name "<tunnel>"', '        set proposal ' + proposalName(cfg.cipher, cfg.integ), '    next', 'end');
    if (cfg.transport === 'tcp') L.push('config system settings', '    set ike-tcp-port ' + cfg.tcpPort, 'end');
    L.push('config system interface', '    edit "<tunnel>"');
    if (plan.emit) L.push('        set mtu-override enable', '        set mtu ' + plan.value);
    L.push('        set tcp-mss ' + MSS, '    next', 'end');
    L.push(t('cliComment'));
    L.push('config firewall policy', '    edit <id>', '        set srcintf "<tunnel>"', '        set dstintf "<lan>"',
      '        set tcp-mss-sender ' + MSS, '        set tcp-mss-receiver ' + MSS, '    next', 'end');
    return L;
  }

  function cliLines(cfg, m) {
    const U = m ? m.U : '<mtu>';
    const plan = mtuPlan(cfg, m);
    const mtuLines = plan.emit ? ['        set mtu-override enable', '        set mtu ' + plan.value] : [];
    const MSS = m && m.U > 40 ? m.U - 40 : '<mss>';
    const gre = cfg.overlay === 'gre', vx = cfg.overlay === 'vxlan';
    const L = [];
    L.push('config vpn ipsec phase1-interface', '    edit "<tunnel>"', '        set interface "<wan>"', '        set ike-version 2', '        set remote-gw <remote-gw>');
    p1Bits(cfg, L);
    L.push('    next', 'end');
    L.push('config vpn ipsec phase2-interface', '    edit "<tunnel>"', '        set phase1name "<tunnel>"', '        set proposal ' + proposalName(cfg.cipher, cfg.integ));
    if (gre) L.push('        set protocol 47');
    if (gre && cfg.mode === 'transport') L.push('        set encapsulation transport-mode');
    L.push('    next', 'end');
    if (cfg.transport === 'tcp') L.push('config system settings', '    set ike-tcp-port ' + cfg.tcpPort, 'end');
    let dst = '"<tunnel>"';
    if (cfg.overlay === 'none') {
      L.push('config system interface', '    edit "<tunnel>"');
      mtuLines.forEach(x => L.push(x));
      L.push('        set tcp-mss ' + MSS, '    next', 'end');
    } else if (gre && cfg.mode === 'tunnel') {
      L.push('config system interface', '    edit "<tunnel>"', '        set ip <tun-local-ip> 255.255.255.255', '        set remote-ip <tun-remote-ip> 255.255.255.255');
      mtuLines.forEach(x => L.push(x));
      L.push('    next', 'end');
      L.push('config system gre-tunnel', '    edit "<gre>"', '        set interface "<tunnel>"', '        set local-gw <tun-local-ip>', '        set remote-gw <tun-remote-ip>');
      if (cfg.greCsum) L.push('        set checksum-transmission enable', '        set checksum-reception enable');
      if (cfg.greKey) L.push('        set key-outbound <key>', '        set key-inbound <key>');
      if (cfg.greSeq) L.push('        set sequence-number-transmission enable', '        set sequence-number-reception enable');
      L.push('    next', 'end');
      dst = '"<gre>"';
    } else if (gre) {
      dst = '"<gre>"';
    } else if (vx) {
      L.push('config system interface', '    edit "<tunnel>"', '        set ip <tun-local-ip> 255.255.255.255', '        set remote-ip <tun-remote-ip> <mask>');
      mtuLines.forEach(x => L.push(x));
      L.push('    next', 'end');
      L.push('config system vxlan', '    edit "<vxlan>"', '        set interface "<tunnel>"', '        set vni <vni>', '        set remote-ip "<tun-remote-ip>"', '    next', 'end');
    }
    L.push(t('cliComment'));
    L.push('config firewall policy', '    edit <id>');
    if (vx) L.push('        set srcintf "<lan>" "<vxlan>"', '        set dstintf "<lan>" "<vxlan>"');
    else L.push('        set srcintf "<lan>"', '        set dstintf ' + dst);
    L.push('        set tcp-mss-sender ' + MSS, '        set tcp-mss-receiver ' + MSS, '    next', 'end');
    return L;
  }

  function renderCli(cfg, m, validProp) {
    const ra = cfg.kind === 'ra';
    const lines = ra ? cliLinesRA(cfg, m) : cliLines(cfg, m);
    const hl = line => (/^#/.test(line) ? '<span class="cm">' + esc(line) + '</span>' : esc(line)
      .replace(/&lt;[^&]*?&gt;/g, s => '<span class="ph">' + s + '</span>')
      .replace(/^(\s*)(config|edit|set|next|end)\b/, '$1<span class="kw">$2</span>'));
    $('cli').innerHTML = lines.map(hl).join('\n');
    $('cli').dataset.plain = lines.join('\n');
    $('cliTag').textContent = 'FortiOS 7.6 · P1 ' + (cfg.p1enc === 'default' ? 'default' : p1Proposal(cfg)) + ' · P2 ' + proposalName(cfg.cipher, cfg.integ) + (validProp ? '' : ' ✕');
    const n = ra ? [t('cliN_raBase'), t('cliN_p1')] : [t('cliN_p1')];
    if (ra) n.push(cfg.transport === 'esp' ? t('cliN_raEsp') : cfg.transport === 'udp' ? t('cliN_nat') : t('cliN_raTcp'));
    else n.push(cfg.transport === 'esp' ? t('cliN_esp') : cfg.transport === 'udp' ? t('cliN_nat') : t('cliN_tcp'));
    const plan = mtuPlan(cfg, m);
    const saTxt = plan.sa !== null ? plan.sa : '—';
    if (plan.mode === 'transport') { if (plan.reason !== 'none') n.push(t('cliN_mtuT')); }
    else n.push(t(plan.reason === 'pre' ? 'cliN_mtuPre' : plan.reason === 'low' ? 'cliN_mtuLow' : 'cliN_mtuNone', { n: saTxt }));
    if (plan.emit && plan.reason === 'low') n.push(t('cliN_mtu'));
    if (cfg.ipfrag === 'pre') n.push(t('cliN_np6'));
    n.push(t('cliN_mss'));
    if (ra) n.push(t('cliN_raMss'), t('cliN_raAuto'));
    if (cfg.overlay === 'gre') n.push(cfg.mode === 'tunnel' ? t('cliN_gre') : t('cliN_greT'));
    if (cfg.overlay === 'vxlan') n.push(t('cliN_vx'));
    $('cliNotes').innerHTML = n.map(x => '<li>' + x + '</li>').join('');
  }

  function xmlLines(cfg, m) {
    const ri = raInfo(cfg, m);
    const I = n => '    '.repeat(n);
    const tm = cfg.transport === 'tcp' ? 1 : 0;
    const L = ['<forticlient_configuration>', I(1) + '<vpn>', I(2) + '<ipsecvpn>', I(3) + '<options>',
      I(4) + '<mtu_size>' + (ri.ok ? cfg.mtuSize : 'MTU-SIZE') + '</mtu_size>', I(3) + '</options>',
      I(3) + '<connections>', I(4) + '<connection>', I(5) + '<name>VPN-NAME</name>', I(5) + '<ike_settings>',
      I(6) + '<version>2</version>', I(6) + '<server>REMOTE-GW</server>',
      I(6) + '<nat_traversal>' + (cfg.transport === 'esp' ? 0 : 1) + '</nat_traversal>',
      I(6) + '<transport_mode>' + tm + '</transport_mode>'];
    if (tm === 1) L.push(I(6) + '<tcp_port>' + cfg.tcpPort + '</tcp_port>');
    L.push(I(6) + '<enable_ike_fragmentation>' + (cfg.ikeFrag ? 1 : 0) + '</enable_ike_fragmentation>',
      I(6) + '<dhgroup>' + (cfg.dh.length ? cfg.dh.join(';') : 'DH-GROUP') + '</dhgroup>');
    if (XML_ENC[cfg.p1enc]) L.push(I(6) + '<proposals>', I(7) + '<proposal>' + XML_ENC[cfg.p1enc] + '|' + cfg.p1prf.toUpperCase() + '</proposal>', I(6) + '</proposals>');
    else L.push(I(6) + t('xmlGcmComment'));
    L.push(I(5) + '</ike_settings>', I(5) + '<ipsec_settings>');
    if (CIPHERS[cfg.cipher].aead) L.push(I(6) + t('xmlGcmComment'));
    else L.push(I(6) + '<proposals>', I(7) + '<proposal>' + XML_ENC[cfg.cipher] + '|' + cfg.integ.toUpperCase() + '</proposal>', I(6) + '</proposals>');
    L.push(I(5) + '</ipsec_settings>', I(4) + '</connection>', I(3) + '</connections>', I(2) + '</ipsecvpn>', I(1) + '</vpn>', '</forticlient_configuration>');
    return L;
  }

  function renderXml(cfg, m) {
    const lines = xmlLines(cfg, m);
    const hlx = line => {
      const e = esc(line);
      if (/^\s*&lt;!--/.test(e)) return '<span class="cm">' + e + '</span>';
      return e.replace(/&lt;\/?[a-z_]+&gt;/g, x => '<span class="kw">' + x + '</span>')
        .replace(/\b(VPN-NAME|REMOTE-GW|DH-GROUP|MTU-SIZE)\b/g, '<span class="ph">$1</span>');
    };
    $('xml').innerHTML = lines.map(hlx).join('\n');
    $('xml').dataset.plain = lines.join('\n');
    $('xmlNotes').innerHTML = ['xmlN1', 'xmlN2', 'xmlN3'].map(k => '<li>' + t(k) + '</li>').join('');
  }

  function renderStatic() {
    $('ikeNotes').innerHTML = ['ik1', 'ik2', 'ik3', 'ik4', 'ik5'].map(k => '<li>' + t(k) + '</li>').join('');
    $('notes').innerHTML = ['n1', 'n2', 'n3', 'n4', 'n5', 'n6', 'n7'].map(k => '<li>' + t(k) + '</li>').join('');
    const base = { pathMtu: 1500, tcpOpt: 0, overlay: 'none', mode: 'tunnel' };
    const rows = VECTORS.map(v => {
      const m = maxUser(Object.assign({}, base, { transport: v.tr, cipher: v.c, integ: v.i }));
      const got = m ? m.U : '—';
      const pass = got === v.fgt;
      return '<tr><td><code>' + proposalName(v.c, v.i) + '</code></td><td>' + TR_LABEL[v.tr] + '</td><td class="n">' + v.dst + '</td><td class="n">' + v.fgt +
        '</td><td class="n">' + got + ' <span class="' + (pass ? 'ok-mark' : 'bad-mark') + '">' + (pass ? '✓' : '✕') + '</span></td>' +
        '<td class="ref"><a href="' + v.src[1] + '" target="_blank" rel="noopener">' + esc(v.src[0]) + '</a></td></tr>';
    }).join('');
    $('vectors').innerHTML = '<thead><tr><th scope="col">' + t('vProp') + '</th><th scope="col">' + t('vEnc') + '</th><th scope="col" class="n">' + t('vDst') +
      '</th><th scope="col" class="n">' + t('vFgt') + '</th><th scope="col" class="n">' + t('vCalc') + '</th><th scope="col">' + t('vSrc') + '</th></tr></thead><tbody>' + rows + '</tbody>';
    $('sources').innerHTML = SOURCES.map(s => '<li><a href="' + s[1] + '" target="_blank" rel="noopener">' + esc(s[0]) + '</a></li>').join('');
  }

  function applyLang() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
    ['cs', 'en'].forEach(l => $('lang-' + l).setAttribute('aria-pressed', String(l === lang)));
    renderStatic();
    render(true);
  }

  /* ----- events ----- */
  document.querySelector('.panel').addEventListener('input', e => {
    const el = e.target;
    if (el.id === 'p1enc') fillP1Prf();
    if (el.name === 'kind') applyKind(el.value);
    if (el.name === 'preset') {
      if (el.value !== 'custom') $('wanMtu').value = el.value;
      else $('wanMtu').focus();
    } else if (el.id === 'wanMtu') {
      const v = el.value;
      const id = v === '1500' ? 'p-eth' : v === '1492' ? 'p-pppoe' : 'p-custom';
      $(id).checked = true;
    }
    render();
  });
  document.querySelector('.panel').addEventListener('change', () => render());
  $('pkt').addEventListener('input', () => renderCheck(readCfg(), isValidProposal($('cipher').value, $('integ').value)));

  $('matrix').addEventListener('click', e => {
    const b = e.target.closest('button[data-fam]');
    if (!b) return;
    const fam = b.dataset.fam;
    if (CIPHERS[$('cipher').value].fam !== fam) {
      $('cipher').value = FAMILIES.find(f => f.fam === fam).rep;
    }
    if (b.dataset.integ) $('integ').value = b.dataset.integ;
    render(true);
  });

  const pickBar = g => {
    $('cipher').value = g.dataset.c;
    if (g.dataset.i !== 'null') $('integ').value = g.dataset.i;
    render(true);
  };
  $('pchart').addEventListener('click', e => { const g = e.target.closest('.bar'); if (g) pickBar(g); });
  $('pchart').addEventListener('keydown', e => {
    const g = e.target.closest('.bar');
    if (g && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); pickBar(g); }
  });
  const tipEl = $('tip');
  const showTip = (el, x, y) => {
    tipEl.textContent = el.getAttribute('data-tip');
    tipEl.hidden = false;
    const w = tipEl.offsetWidth, h = tipEl.offsetHeight;
    tipEl.style.left = Math.min(x + 14, window.innerWidth - w - 8) + 'px';
    tipEl.style.top = Math.max(8, y - h - 12) + 'px';
  };
  document.addEventListener('mousemove', e => {
    const el = e.target.closest && e.target.closest('[data-tip]');
    if (el) showTip(el, e.clientX, e.clientY); else tipEl.hidden = true;
  });
  document.addEventListener('focusin', e => {
    const el = e.target.closest && e.target.closest('.bar[data-tip]');
    if (el) { const b = el.getBoundingClientRect(); showTip(el, b.left + b.width / 2, b.top); } else tipEl.hidden = true;
  });
  document.addEventListener('scroll', () => { tipEl.hidden = true; }, { passive: true });

  document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => {
    lang = b.dataset.lang;
    try { localStorage.setItem('ipsecmtu.lang', lang); } catch (e) { /* ignore */ }
    applyLang();
  }));

  const bindCopy = (btnId, preId) => $(btnId).addEventListener('click', () => {
    const btn = $(btnId), text = $(preId).dataset.plain || '';
    const done = msg => { btn.textContent = msg; setTimeout(() => { btn.textContent = t('copy'); }, 1800); };
    const fallback = () => {
      const range = document.createRange();
      range.selectNodeContents($(preId));
      const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
      done(t('copyFail'));
    };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => done(t('copied')), fallback);
      else fallback();
    } catch (e) { fallback(); }
  });

  bindCopy('copyBtn', 'cli');
  bindCopy('copyXml', 'xml');
  applyKind(document.querySelector('input[name="kind"]:checked').value);
  applyLang();
})();

</script>
</body>
</html>
