<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fortinet Product Lifecycle Radar</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap');

  :root{
    --bg:#f5f6fa;
    --surface:#ffffff;
    --surface-alt:#eff1f7;
    --border:#e1e4ee;
    --text:#023444;
    --text-muted:#5b707b;
    --accent:#884dff;
    --accent-strong:#6b2fe0;
    --accent-soft:#f1e9ff;
    --danger:#c8443a;
    --danger-soft:#fbeae7;
    --warning:#b8790a;
    --warning-soft:#fbf1dc;
    --mid:#8a8600;
    --mid-soft:#f7f7d0;
    --ok:#4c8a00;
    --ok-soft:#eaf7d2;
    --shadow:0 1px 2px rgba(2,52,68,.06), 0 10px 26px -14px rgba(2,52,68,.18);
    --radius:10px;
    --date-icon-filter:none;
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Sora', ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:1440px;
    margin:0 auto;
    padding:40px 24px 64px;
    display:flex;
    flex-direction:column;
    gap:28px;
  }
  .mono{ font-family:'Sora', ui-monospace, SFMono-Regular, monospace; }
  .tabular{ font-variant-numeric:tabular-nums; }

  header.page{
    display:flex;
    flex-direction:column;
    gap:10px;
    border-bottom:1px solid var(--border);
    padding-bottom:24px;
  }
  .eyebrow{
    font-family:'Sora', monospace;
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--accent-strong);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .eyebrow .dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft);
  }
  h1{
    margin:0;
    font-size:clamp(26px,3.4vw,36px);
    font-weight:700;
    letter-spacing:-.01em;
    text-wrap:balance;
  }
  .brand-row{
    display:flex;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
  }
  .brand-logo{
    flex:none;
    display:inline-flex;
    align-items:center;
    background:#ffffff;
    border:1px solid var(--border);
    border-radius:8px;
    padding:7px 12px;
    box-shadow:var(--shadow);
  }
  .brand-logo img{
    display:block;
    height:20px;
    width:auto;
  }
  .updated-note{
    font-family:'Sora', monospace;
    font-size:12px;
    color:var(--text-muted);
  }
  .lede{
    color:var(--text-muted);
    font-size:14.5px;
    line-height:1.6;
    max-width:72ch;
  }
  .lede b{ color:var(--text); font-weight:600; }
  .source-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px 18px;
    font-size:12.5px;
    color:var(--text-muted);
    font-family:'Sora', monospace;
  }
  .source-row a{ color:var(--accent-strong); text-decoration:none; }
  .source-row a:hover{ text-decoration:underline; }

  .stat-row{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
  }
  .stat{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:18px 20px;
    box-shadow:var(--shadow);
    display:flex;
    flex-direction:column;
    gap:6px;
    cursor:pointer;
    transition:border-color .15s ease, transform .15s ease;
  }
  .stat:hover{ border-color:var(--accent); }
  .stat.active{ border-color:var(--accent); background:var(--accent-soft); }
  .stat .label{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.09em;
    color:var(--text-muted);
    font-weight:600;
  }
  .stat .value{
    font-family:'Sora', monospace;
    font-size:32px;
    font-weight:600;
    line-height:1;
  }
  .swatch{ width:7px; height:7px; border-radius:2px; display:inline-block; }

  .panel{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  .toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    align-items:center;
    padding:16px 18px;
    border-bottom:1px solid var(--border);
    background:var(--surface-alt);
  }
  .tabs{ display:flex; gap:4px; }
  .tab-btn{
    font-family:'Sora', sans-serif;
    font-size:13.5px;
    font-weight:600;
    padding:7px 14px;
    border-radius:7px;
    border:1px solid transparent;
    background:transparent;
    color:var(--text-muted);
    cursor:pointer;
  }
  .tab-btn.active{
    background:var(--surface);
    border-color:var(--border);
    color:var(--text);
  }
  .search-box{
    flex:1;
    min-width:180px;
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:7px;
    padding:7px 12px;
  }
  .search-box input{
    border:none;
    outline:none;
    background:transparent;
    color:var(--text);
    font-family:'Sora', monospace;
    font-size:13px;
    width:100%;
  }
  .search-box svg{ flex:none; color:var(--text-muted); }
  select.cat-filter{
    font-family:'Sora', sans-serif;
    font-size:13px;
    color:var(--text);
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:7px;
    padding:7px 10px;
  }
  .date-from{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:7px;
    padding:6px 10px;
  }
  .date-from label{
    font-size:12px;
    color:var(--text-muted);
    white-space:nowrap;
  }
  .date-from input[type="date"]{
    font-family:'Sora', monospace;
    font-size:13px;
    color:var(--text);
    background:transparent;
    border:none;
    outline:none;
  }
  .date-from input[type="date"]::-webkit-calendar-picker-indicator{
    filter:var(--date-icon-filter, none);
    cursor:pointer;
  }
  .date-from .btn-all{
    font-family:'Sora', sans-serif;
    font-size:11.5px;
    font-weight:600;
    color:var(--accent-strong);
    background:var(--accent-soft);
    border:none;
    border-radius:5px;
    padding:4px 8px;
    cursor:pointer;
    white-space:nowrap;
  }
  .date-from .btn-all:hover{ background:var(--accent); color:#fff; }
  .table-scroll{ overflow-x:auto; }
  table{
    width:100%;
    border-collapse:collapse;
    font-size:13px;
  }
  thead th{
    position:sticky;
    top:0;
    background:var(--surface-alt);
    text-align:left;
    padding:10px 12px;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--text-muted);
    font-weight:600;
    border-bottom:1px solid var(--border);
    cursor:pointer;
    white-space:nowrap;
    user-select:none;
  }
  thead th:hover{ color:var(--text); }
  thead th .arrow{ opacity:.5; margin-left:3px; }
  thead th.sorted .arrow{ opacity:1; color:var(--accent); }
  tbody td{
    padding:9px 12px;
    border-bottom:1px solid var(--border);
    vertical-align:middle;
    white-space:nowrap;
  }
  tbody tr:hover td{ background:var(--surface-alt); }
  tbody tr:last-child td{ border-bottom:none; }
  td.product{
    font-family:'Sora', monospace;
    font-weight:500;
    white-space:normal;
    max-width:300px;
  }
  td.cat{
    color:var(--text-muted);
    font-size:12px;
  }
  td.date{ font-family:'Sora', monospace; }

  .pill{
    display:inline-flex;
    align-items:center;
    gap:5px;
    padding:3px 9px;
    border-radius:20px;
    font-family:'Sora', monospace;
    font-size:11px;
    font-weight:600;
    white-space:nowrap;
  }
  .pill .swatch{ width:6px; height:6px; border-radius:50%; }
  .pill.past{ background:var(--danger-soft); color:var(--danger); }
  .pill.soon{ background:var(--warning-soft); color:var(--warning); }
  .pill.mid{ background:var(--mid-soft); color:var(--mid); }
  .pill.ok{ background:var(--ok-soft); color:var(--ok); }
  .pill .swatch.past{ background:var(--danger); }
  .pill .swatch.soon{ background:var(--warning); }
  .pill .swatch.mid{ background:var(--mid); }
  .pill .swatch.ok{ background:var(--ok); }

  .empty{
    padding:48px 20px;
    text-align:center;
    color:var(--text-muted);
    font-size:13.5px;
  }
  .result-count{
    padding:10px 18px;
    font-size:12px;
    color:var(--text-muted);
    border-top:1px solid var(--border);
    background:var(--surface-alt);
    font-family:'Sora', monospace;
  }

  footer.page{
    display:flex;
    flex-wrap:wrap;
    justify-content:space-between;
    gap:10px;
    color:var(--text-muted);
    font-size:12px;
    padding-top:6px;
  }
  footer.page a{ color:var(--accent-strong); text-decoration:none; }
  footer.page a:hover{ text-decoration:underline; }

  @media (max-width:720px){
    .stat-row{ grid-template-columns:1fr; }
    .toolbar{ flex-direction:column; align-items:stretch; }
  }
</style>
</head>

<script>
const TODAY = "__TODAY_ISO__";
const DATA = __DATA_JSON__;

const TABS = [
  { key:'hardware', label:'Hardware', cols:[
      {k:'t', label:'Produkt / model', cls:'product'},
      {k:'c', label:'Kategorie', cls:'cat'},
      {k:'p', label:'Zveřejněno', cls:'date'},
      {k:'eo', label:'End of Order', cls:'date'},
      {k:'lse', label:'Last Service Extension', cls:'date'},
      {k:'eos', label:'End of Support', cls:'date'},

  { key:'software', label:'Software', cols:[
      {k:'t', label:'Produkt / verze', cls:'product'},
      {k:'c', label:'Rodina', cls:'cat'},

      {k:'rel', label:'Release', cls:'date'},
      {k:'eng', label:'End of Eng. Support', cls:'date'},
      {k:'eos', label:'End of Support', cls:'date'},

      {k:'c', label:'Kategorie', cls:'cat'},
      {k:'p', label:'Zveřejněno', cls:'date'},
      {k:'eo', label:'End of Order', cls:'date'},
      {k:'lse', label:'Last Service Extension', cls:'date'},
      {k:'eos', label:'End of Support', cls:'date'},
      {k:'s', label:'Stav', cls:'status'},
    ]},

const STATUS_LABEL = { past:'Po EoS', soon:'Brzy EoS (≤180 dní)', mid:'V pořádku (≤365 dní)', ok:'V pořádku (>365 dní)', unknown:'Neznámý' };

let state = {
  tab: 'hardware',
  search: '',
  category: '',
  fromDate: '',
  sortKey: 'p',
  sortDir: 'desc',
};

function monthsAgoStr(dateStr, months){
  const d = new Date(dateStr + 'T00:00:00');
  d.setMonth(d.getMonth() - months);
  return d.toISOString().slice(0,10);
}
const CUTOFF_6M = monthsAgoStr(TODAY, 6);
state.fromDate = CUTOFF_6M;

function fmtDate(d){
  if(!d || d === 'N/A' || d === '—') return '—';
  return d;
}

function rowsInRange(key){
  const d = DATA[key];
  return state.fromDate ? d.rows.filter(r => r.p >= state.fromDate) : d.rows;
}

function renderStats(){
  const row = document.getElementById('stat-row');
  row.innerHTML = '';
  TABS.forEach(tab => {
    const filtered = rowsInRange(tab.key);
    const el = document.createElement('div');
    el.className = 'stat' + (state.tab === tab.key ? ' active' : '');
    el.innerHTML = `
      <div class="label">${tab.label}</div>
      <div class="value tabular">${filtered.length}</div>`;
    el.addEventListener('click', () => { state.tab = tab.key; state.category=''; state.search=''; document.getElementById('search').value=''; render(); });
    row.appendChild(el);
  });
}

function renderTabs(){
  const wrap = document.getElementById('tabs');
  wrap.innerHTML = '';
  TABS.forEach(tab => {
    const b = document.createElement('button');
    b.className = 'tab-btn' + (state.tab === tab.key ? ' active' : '');
    b.textContent = `${tab.label} (${rowsInRange(tab.key).length})`;
    b.addEventListener('click', () => { state.tab = tab.key; state.category=''; render(); });
    wrap.appendChild(b);
  });
}

function renderCatFilter(){
  const sel = document.getElementById('cat-filter');
  const rows = DATA[state.tab].rows;
  const cats = Array.from(new Set(rows.map(r => r.c))).sort();
  sel.innerHTML = '<option value="">Všechny kategorie</option>' + cats.map(c => `<option value="${c}">${c}</option>`).join('');
  sel.value = state.category;
}

function sortIcon(key){
  if(state.sortKey !== key) return '<span class="arrow">↕</span>';
  return `<span class="arrow">${state.sortDir === 'asc' ? '↑' : '↓'}</span>`;
}

function renderTable(){
  const tab = TABS.find(t => t.key === state.tab);
  const head = document.getElementById('table-head');
  head.innerHTML = tab.cols.map(c => `<th data-key="${c.k}" class="${state.sortKey===c.k?'sorted':''}">${c.label}${sortIcon(c.k)}</th>`).join('');
  head.querySelectorAll('th').forEach(th => {
    th.addEventListener('click', () => {
      const k = th.dataset.key;
      if(state.sortKey === k){ state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc'; }
      else { state.sortKey = k; state.sortDir = k === 't' || k === 'c' ? 'asc' : 'desc'; }
      render();
    });
  });

  let rows = DATA[state.tab].rows.slice();

  if(state.fromDate) rows = rows.filter(r => r.p >= state.fromDate);
  if(state.category) rows = rows.filter(r => r.c === state.category);
  if(state.search){
    const q = state.search.toLowerCase();
    rows = rows.filter(r => r.t.toLowerCase().includes(q) || r.c.toLowerCase().includes(q));
  }

  rows.sort((a,b) => {
    let av = a[state.sortKey] ?? '', bv = b[state.sortKey] ?? '';
    let cmp = String(av).localeCompare(String(bv));
    return state.sortDir === 'asc' ? cmp : -cmp;
  });

  const body = document.getElementById('table-body');
  const empty = document.getElementById('empty-state');
  if(rows.length === 0){
    body.innerHTML = '';
    empty.hidden = false;
  } else {
    empty.hidden = true;
    body.innerHTML = rows.map(r => `<tr>${tab.cols.map(c => {
      if(c.k === 's'){
        return `<td class="status"><span class="pill ${r.s}"><span class="swatch ${r.s}"></span>${STATUS_LABEL[r.s]||r.s}</span></td>`;
      }
      const val = c.cls === 'date' ? fmtDate(r[c.k]) : (r[c.k] ?? '—');
      return `<td class="${c.cls}${c.cls==='date'?' tabular':''}">${val}</td>`;
    }).join('')}</tr>`).join('');
  }

  const rangeNote = state.fromDate ? ` · od ${state.fromDate}` : '';
  document.getElementById('result-count').textContent = `${rows.length} z ${DATA[state.tab].count} položek zobrazeno${rangeNote}`;
}

function render(){
  renderStats();
  renderTabs();
  renderCatFilter();
  renderTable();
}

document.getElementById('search').addEventListener('input', (e) => { state.search = e.target.value; renderTable(); });
document.getElementById('cat-filter').addEventListener('change', (e) => { state.category = e.target.value; renderTable(); });
const fromDateInput = document.getElementById('from-date');
fromDateInput.value = state.fromDate;
fromDateInput.addEventListener('change', (e) => { state.fromDate = e.target.value; render(); });
document.getElementById('from-date-all').addEventListener('click', () => {
  state.fromDate = '2000-01-01';
  fromDateInput.value = state.fromDate;
  render();
});
document.getElementById('from-date-today').addEventListener('click', () => {
  state.fromDate = TODAY;
  fromDateInput.value = state.fromDate;
  render();
});

const genNote = `Aktualizováno: ${TODAY}`;
document.getElementById('updated-note').textContent = genNote;

render();
</script>
</body>
</html>
