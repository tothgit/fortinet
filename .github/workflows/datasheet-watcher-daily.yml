name: Daily Fortinet Datasheet Watcher update

"on":
  schedule:
    # 06:35 UTC = 08:35 Prague time while CEST is in effect (roughly late
    # March to late October); shifts to 07:35 Prague once CET resumes.
    # 15 minutes after the Product Lifecycle Radar's own daily job, and
    # deliberately off the top of the hour: GitHub documents that scheduled
    # events are most likely to be delayed or dropped at the start of an hour.
    - cron: '35 6 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'datasheet-watcher/template.html'
      - '.github/scripts/build_datasheet_watcher.py'

permissions:
  contents: write
  pages: write
  id-token: write

# Same deployment group as the other daily jobs — only one Pages
# deployment runs at a time.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history: the default shallow clone (fetch-depth: 1) cannot
          # be rebased onto the remote branch reliably.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Refresh data from fortinet.com/resources/data-sheets and render index.html
        run: python .github/scripts/build_datasheet_watcher.py

      - name: Commit refreshed index.html and state.json (if they changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add datasheet-watcher/index.html datasheet-watcher/data/state.json
          if git diff --cached --quiet; then
            echo "No data changes today."
            exit 0
          fi
          git commit -m "Daily datasheet check: $(date -u +%Y-%m-%d)"
          # Another daily job may push to main while this one runs. Rebase
          # onto the remote tip and retry instead of failing the whole run.
          pushed=0
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              pushed=1
              break
            fi
            echo "Push attempt ${attempt} failed; retrying in $((attempt * 5))s..."
            sleep $((attempt * 5))
          done
          if [ "${pushed}" -ne 1 ]; then
            echo "::error::Could not push datasheet-watcher files after 3 attempts."
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload the whole repo root (not just datasheet-watcher/) so the
          # published URL keeps the /datasheet-watcher/ path segment.
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
