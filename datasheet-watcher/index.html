<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap');

  :root{
    --bg:#f5f6fa;
    --surface:#ffffff;
    --surface-alt:#eff1f7;
    --border:#e1e4ee;
    --text:#023444;
    --text-muted:#5b707b;
    --accent:#884dff;
    --accent-strong:#6b2fe0;
    --accent-soft:#f1e9ff;
    --danger:#c8443a;
    --danger-soft:#fbeae7;
    --broken:#5b6b76;
    --broken-soft:#eef1f3;
    --warning:#b8790a;
    --warning-soft:#fbf1dc;
    --mid:#8a8600;
    --mid-soft:#f7f7d0;
    --ok:#4c8a00;
    --ok-soft:#eaf7d2;
    --shadow:0 1px 2px rgba(2,52,68,.06), 0 10px 26px -14px rgba(2,52,68,.18);
    --radius:10px;
    --date-icon-filter:none;
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Sora', ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:1440px;
    margin:0 auto;
    padding:40px 24px 64px;
    display:flex;
    flex-direction:column;
    gap:28px;
  }
  .mono{ font-family:'Sora', ui-monospace, SFMono-Regular, monospace; }
  .tabular{ font-variant-numeric:tabular-nums; }

  header.page{
    display:flex;
    flex-direction:column;
    gap:10px;
    border-bottom:1px solid var(--border);
    padding-bottom:24px;
  }
  h1{
    margin:0;
    font-size:clamp(26px,3.4vw,36px);
    font-weight:700;
    letter-spacing:-.01em;
    text-wrap:balance;
  }
  .brand-row{
    display:flex;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
  }
  .brand-logo{
    flex:none;
    display:inline-flex;
    align-items:center;
    background:#ffffff;
    border:1px solid var(--border);
    border-radius:8px;
    padding:7px 12px;
    box-shadow:var(--shadow);
  }
  .brand-logo img{
    display:block;
    height:20px;
    width:auto;
  }
  .updated-note{
    font-family:'Sora', monospace;
    font-size:12px;
    color:var(--text-muted);
  }
  .lede{
    color:var(--text-muted);
    font-size:14.5px;
    line-height:1.6;
    max-width:78ch;
  }
  .lede b{ color:var(--text); font-weight:600; }

  .stat-row{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:14px;
  }
  .stat{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:18px 20px;
    box-shadow:var(--shadow);
    display:flex;
    flex-direction:column;
    gap:6px;
    cursor:pointer;
    transition:border-color .15s ease, transform .15s ease;
  }
  .stat:hover{ border-color:var(--accent); }
  .stat.active{ border-color:var(--accent); background:var(--accent-soft); }
  .stat .label{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.09em;
    color:var(--text-muted);
    font-weight:600;
  }
  .stat .value{
    font-family:'Sora', monospace;
    font-size:32px;
    font-weight:600;
    line-height:1;
  }
  .swatch{ width:7px; height:7px; border-radius:2px; display:inline-block; }

  .panel{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  .toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    align-items:center;
    padding:16px 18px;
    border-bottom:1px solid var(--border);
    background:var(--surface-alt);
  }
  .search-box{
    flex:1;
    min-width:180px;
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:7px;
    padding:7px 12px;
  }
  .search-box input{
    border:none;
    outline:none;
    background:transparent;
    color:var(--text);
    font-family:'Sora', monospace;
    font-size:13px;
    width:100%;
  }
  .search-box svg{ flex:none; color:var(--text-muted); }
  select.cat-filter{
    font-family:'Sora', sans-serif;
    font-size:13px;
    color:var(--text);
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:7px;
    padding:7px 10px;
  }
  .table-scroll{ overflow-x:auto; }
  table{
    width:100%;
    border-collapse:collapse;
    font-size:13px;
  }
  thead th{
    position:sticky;
    top:0;
    background:var(--surface-alt);
    text-align:left;
    padding:10px 12px;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--text-muted);
    font-weight:600;
    border-bottom:1px solid var(--border);
    cursor:pointer;
    white-space:nowrap;
    user-select:none;
  }
  thead th:hover{ color:var(--text); }
  thead th .arrow{ opacity:.5; margin-left:3px; }
  thead th.sorted .arrow{ opacity:1; color:var(--accent); }
  tbody td{
    padding:9px 12px;
    border-bottom:1px solid var(--border);
    vertical-align:middle;
    white-space:nowrap;
  }
  tbody tr:hover td{ background:var(--surface-alt); }
  tbody tr:last-child td{ border-bottom:none; }
  td.product{
    font-family:'Sora', monospace;
    font-weight:500;
    white-space:normal;
    max-width:340px;
  }
  td.product a{
    color:var(--accent-strong);
    text-decoration:underline;
    text-decoration-color:var(--accent-soft);
    text-underline-offset:2px;
  }
  td.product a:hover{ color:var(--accent); text-decoration-color:var(--accent); }
  td.product a .ext-icon{ display:inline-block; margin-left:3px; opacity:.7; }
  td.cat{
    color:var(--text-muted);
    font-size:12px;
  }
  td.date{ font-family:'Sora', monospace; }
  td.date.muted{ color:var(--text-muted); font-size:12px; }
  td.date .prev{ color:var(--text-muted); font-size:11px; }

  .pill{
    display:inline-flex;
    align-items:center;
    gap:5px;
    padding:3px 9px;
    border-radius:20px;
    font-family:'Sora', monospace;
    font-size:11px;
    font-weight:600;
    white-space:nowrap;
  }
  .pill .swatch{ width:6px; height:6px; border-radius:50%; }
  .pill.new{ background:var(--accent-soft); color:var(--accent-strong); }
  .pill.changed{ background:var(--warning-soft); color:var(--warning); }
  .pill.unchanged{ background:var(--ok-soft); color:var(--ok); }
  .pill.unknown{ background:var(--danger-soft); color:var(--danger); }
  .pill.broken{ background:var(--broken-soft); color:var(--broken); }
  .pill .swatch.new{ background:var(--accent); }
  .pill .swatch.changed{ background:var(--warning); }
  .pill .swatch.unchanged{ background:var(--ok); }
  .pill .swatch.unknown{ background:var(--danger); }
  .pill .swatch.broken{ background:var(--broken); }

  .empty{
    padding:48px 20px;
    text-align:center;
    color:var(--text-muted);
    font-size:13.5px;
  }
  .result-count{
    padding:10px 18px;
    font-size:12px;
    color:var(--text-muted);
    border-top:1px solid var(--border);
    background:var(--surface-alt);
    font-family:'Sora', monospace;
  }

  footer.page{
    display:flex;
    flex-wrap:wrap;
    justify-content:space-between;
    gap:10px;
    color:var(--text-muted);
    font-size:12px;
    padding-top:6px;
  }
  footer.page a{ color:var(--accent-strong); text-decoration:none; }
  footer.page a:hover{ text-decoration:underline; }

  @media (max-width:900px){
    .stat-row{ grid-template-columns:repeat(2,1fr); }
  }
  @media (max-width:720px){
    .stat-row{ grid-template-columns:1fr; }
    .toolbar{ flex-direction:column; align-items:stretch; }
  }
</style>
</head>

const STATUS_LABEL = { new:'Nové', changed:'Změněno', unchanged:'Beze změny', unknown:'Neověřeno', broken:'Nedostupné' };

const COLS = [
  {k:'t', label:'Datasheet', cls:'product'},
  {k:'f', label:'Kategorie', cls:'cat'},
  {k:'v', label:'Ověřeno (HTTP Last-Modified)', cls:'date'},
  {k:'pd', label:'Dle stránky Fortinet', cls:'date muted'},
  {k:'s', label:'Stav', cls:'status'},
];

let state = {
  search: '',
  category: '',
  status: '',
  sortKey: 'v',
  sortDir: 'desc',
};

function fmtDate(d){
  if(!d) return '—';
  return d;
}

function renderStats(){
  const row = document.getElementById('stat-row');
  const statusStats = [
    {key:'new', label:`Nově zjištěno (${DATA.recent_days} dní)`, value: DATA.new_count},
    {key:'changed', label:`Změněno (${DATA.recent_days} dní)`, value: DATA.changed_count},
    {key:'unknown', label:'Neověřeno (HEAD selhal)', value: DATA.unknown_count},
    {key:'broken', label:'Nedostupné (odkaz nevede na PDF)', value: DATA.broken_count},
  ];
  row.innerHTML = '';

  const totalEl = document.createElement('div');
  totalEl.className = 'stat' + (!state.status ? ' active' : '');
  totalEl.innerHTML = `<div class="label">Sledováno celkem</div><div class="value tabular">${DATA.total}</div>`;
  totalEl.addEventListener('click', () => { state.status = ''; render(); });
  row.appendChild(totalEl);

  statusStats.forEach(s => {
    const el = document.createElement('div');
    el.className = 'stat' + (state.status === s.key ? ' active' : '');
    el.innerHTML = `<div class="label">${s.label}</div><div class="value tabular">${s.value}</div>`;
    el.addEventListener('click', () => { state.status = state.status === s.key ? '' : s.key; render(); });
    row.appendChild(el);
  });
}

function renderCatFilter(){
  const sel = document.getElementById('cat-filter');
  const cats = Array.from(new Set(DATA.rows.map(r => r.f))).sort();
  sel.innerHTML = '<option value="">Všechny rodiny</option>' + cats.map(c => `<option value="${c}">${c}</option>`).join('');
  sel.value = state.category;
}

function sortIcon(key){
  if(state.sortKey !== key) return '<span class="arrow">↕</span>';
  return `<span class="arrow">${state.sortDir === 'asc' ? '↑' : '↓'}</span>`;
}

function renderTable(){
  const head = document.getElementById('table-head');
  head.innerHTML = COLS.map(c => `<th data-key="${c.k}" class="${state.sortKey===c.k?'sorted':''}">${c.label}${sortIcon(c.k)}</th>`).join('');
  head.querySelectorAll('th').forEach(th => {
    th.addEventListener('click', () => {
      const k = th.dataset.key;
      if(state.sortKey === k){ state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc'; }
      else { state.sortKey = k; state.sortDir = (k === 't' || k === 'f') ? 'asc' : 'desc'; }
      render();
    });
  });

  let rows = DATA.rows.slice();

  if(state.category) rows = rows.filter(r => r.f === state.category);
  if(state.status) rows = rows.filter(r => r.s === state.status);
  if(state.search){
    const q = state.search.toLowerCase();
    rows = rows.filter(r => r.t.toLowerCase().includes(q) || r.f.toLowerCase().includes(q));
  }

  rows.sort((a,b) => {
    let av = a[state.sortKey] ?? '', bv = b[state.sortKey] ?? '';
    let cmp = String(av).localeCompare(String(bv));
    return state.sortDir === 'asc' ? cmp : -cmp;
  });

  const body = document.getElementById('table-body');
  const empty = document.getElementById('empty-state');
  if(rows.length === 0){
    body.innerHTML = '';
    empty.hidden = false;
  } else {
    empty.hidden = true;
    body.innerHTML = rows.map(r => {
      return `<tr>${COLS.map(c => {
        if(c.k === 's'){
          return `<td class="status"><span class="pill ${r.s}"><span class="swatch ${r.s}"></span>${STATUS_LABEL[r.s]||r.s}</span></td>`;
        }
        if(c.k === 't'){
          const linkTitle = r.s === 'broken' ? 'Pozor: tento odkaz aktuálně nevede na PDF (přesměrování jinam)' : 'Otevřít / stáhnout PDF';
          return `<td class="product"><a href="${r.u}" target="_blank" rel="noopener" title="${linkTitle}">${r.t}<span class="ext-icon">↗</span></a></td>`;
        }
        if(c.k === 'v'){
          const prevNote = r.prev && r.prev !== r.v ? `<div class="prev">dříve: ${fmtDate(r.prev)}</div>` : '';
          return `<td class="date tabular">${fmtDate(r.v)}${prevNote}</td>`;
        }
        const val = c.cls.indexOf('date') === 0 ? fmtDate(r[c.k]) : (r[c.k] ?? '—');
        return `<td class="${c.cls}${c.cls.indexOf('date')===0?' tabular':''}">${val}</td>`;
      }).join('')}</tr>`;
    }).join('');
  }

  document.getElementById('result-count').textContent = `${rows.length} z ${DATA.total} datasheetů zobrazeno`;
}

function render(){
  renderStats();
  renderCatFilter();
  document.getElementById('cat-filter').value = state.category;
  document.getElementById('status-filter').value = state.status;
  renderTable();
}

document.getElementById('search').addEventListener('input', (e) => { state.search = e.target.value; renderTable(); });
document.getElementById('cat-filter').addEventListener('change', (e) => { state.category = e.target.value; renderTable(); });
document.getElementById('status-filter').addEventListener('change', (e) => { state.status = e.target.value; render(); });

document.getElementById('updated-note').textContent = `Aktualizováno: ${TODAY}`;

render();
</script>
